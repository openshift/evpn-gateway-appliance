[defaults]
inventory = inventory/hosts.yml
roles_path = roles
retry_files_enabled = False
# host_key_checking left at its secure default; pre-seed known_hosts instead of disabling it (source-audit.md §1).

[selinux]
# virtiofs (Vagrant shared folder) can't set SELinux xattrs; append it to the default list so
# file writes into the repo don't fail with "invalid selinux context: Operation not supported".
special_context_filesystems = fuse,nfs,vboxsf,ramfs,9p,vfat,virtiofs
