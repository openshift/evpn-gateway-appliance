---
# Reboot proxy: restart the instance. Its /etc writable layer persists across a restart (only
# /run and /tmp are tmpfs), so NetworkManager re-reads the ega-* profiles on boot and the fabric
# comes back; the dispatchers re-assert the self-VLANs and neigh_suppress as the interfaces come up.
# verify then asserts the contract still holds — i.e. the configuration is persistent.
- name: Side effect — restart the instance (reboot proxy)
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Restart the instance(s)
      ansible.builtin.command: podman restart {{ item.name }}
      loop: "{{ molecule_yml.platforms }}"
      changed_when: true

- name: Wait for NetworkManager after restart
  hosts: all
  gather_facts: false
  tasks:
    - name: Wait for NetworkManager to be active again
      ansible.builtin.command: systemctl is-active NetworkManager
      register: _nm
      until: _nm.stdout == "active"
      retries: 30
      delay: 2
      changed_when: false
