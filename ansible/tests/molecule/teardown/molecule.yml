---
# Teardown scenario: converge the on-prem networking, then tear it down and assert nothing ega-*
# remains and the trunk NIC is released (but survives). create/destroy/prepare/converge are shared
# from ../resources; side_effect (the teardown) and verify are scenario-local.
dependency:
  name: galaxy
  enabled: false
driver:
  name: default
platforms:
  - name: ega-molecule-teardown
provisioner:
  name: ansible
  env:
    # Passed explicitly (molecule can sanitize the inherited environment): the collections path
    # for FQCN resolution, the rootful podman socket the podman connection/CLI target, and the
    # appliance image the delegated create runs. All are exported by entrypoint_molecule.sh.
    ANSIBLE_COLLECTIONS_PATH: ${ANSIBLE_COLLECTIONS_PATH}
    CONTAINER_HOST: ${CONTAINER_HOST}
    EGA_NODE_IMAGE: ${EGA_NODE_IMAGE}
  playbooks:
    create: ../resources/create.yml
    destroy: ../resources/destroy.yml
    prepare: ../resources/prepare.yml
    converge: ../resources/converge.yml
scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - create
    - prepare
    - converge
    - idempotence
    - side_effect
    - verify
    - cleanup
    - destroy
verifier:
  name: ansible
