---
# ── Tunnel ────────────────────────────────────────────────────
# Supported types:
#   wireguard      — dev/test, terminates on infra EC2
#   ipsec          — Site-to-Site VPN, TGW cloud-side, Libreswan on-prem
#                    requires on-prem public IP for Customer Gateway
#   direct-connect — production, DX partner + jumbo MTU
#
# MTU modes:
#   safe           — underlay MTU ≥ 1550, no clamping (default)
#   unsafe         — underlay MTU < 1550, TCP MSS clamping + DF bit,
#                    UDP > MTU is dropped, live migration will not work
tunnel:
  type: wireguard          # or 'ipsec' or 'direct-connect'
  mtu_mode: unsafe         # safe requires underlay MTU ≥ 1550
  onprem_ip: 10.44.44.1    # WG: tunnel address. IPSec/DX: VTEP loopback
  cloud_ip: 10.44.44.2     # WG: tunnel address. IPSec/DX: ignored
  # Optional (defaults to this value if unset); covers onprem_ip/cloud_ip.
  # Update if you change onprem_ip/cloud_ip off their defaults — it is not
  # derived automatically.
  network_cidr: 10.44.44.0/24
  port: 51820              # WG only

# ── Fabric peer hostnames ───────────────────────────────────────
infra_relay_host: infra-router

# ── Standalone workload VTEP (dev/test only — CORENET-7515) ────
# In production, OCP 4.22+ native EVPN is the workload VTEP.
# Set standalone_workload_vtep to true only when using deploy-dev.yml
# with the evpn_cloud_workload role for lab/migration validation.
standalone_workload_vtep: false
workload_vtep_host: workload-router  # Only used when standalone_workload_vtep is true.

# ── OCP-native EVPN peer (production) ──────────────────────────
# Set ocp_vtep_peer_ip to the IP of the OCP frr-k8s node peering with
# the infra relay.  Health checks use this to verify the BGP session
# and EVPN prefix exchange.
# ocp_vtep_peer_ip: 10.200.x.x

# ── Cloud network CIDRs (shared by evpn_aws_infra provisioning and the onprem WireGuard client's AllowedIPs) ──
# All optional — templates fall back to these same values if left unset; set here once to keep both roles in sync if you change them.
infra_vpc_cidr: 10.100.0.0/16
workload_vpc_cidr: 10.200.0.0/16
ocp_pod_network_cidr: 10.128.0.0/16  # OCP pod network in the workload VPC; override to match your cluster (OpenShift default cluster network is 10.128.0.0/14).

# ── BGP ───────────────────────────────────────────────────────
bgp:
  onprem_asn: 65044
  infra_asn: 65100
  workload_asn: 65200
  # max_prefix: 1000   # Defensive backstop only; defaults to 1000 if omitted (source-audit.md §1).

# ── VLAN Stretches ────────────────────────────────────────────
stretches:
  - vlan: 100
    name: production
    subnet: 10.42.1.0/24
    onprem_gateway: 10.42.1.1
    cloud_gateway: 10.42.1.2

  - vlan: 200
    name: staging
    subnet: 10.42.2.0/24
    onprem_gateway: 10.42.2.1
    cloud_gateway: 10.42.2.2

  - vlan: 300
    name: management
    subnet: 10.42.3.0/24
    onprem_gateway: 10.42.3.1
    cloud_gateway: 10.42.3.2

# ── Monitoring ────────────────────────────────────────────────
monitoring:
  frr_exporter: true
  node_exporter: true

# ── FRR container image ──────────────────────────────────────
frr_image: quay.io/frrouting/frr:10.5.3   # pinned, not :latest; the templates now read their "frr version" line from this tag (kickoff-decisions.md #10).

# ── AWS admin-plane access (evpn_aws_infra role) ───────────────
# evpn_aws_infra_admin_cidr: 203.0.113.4/32   # required by provision-aws.yml, no safe default (source-audit.md §1).
