---
# Production deploy — discovers OCP frr-k8s peers unless skip_frr_discovery is true.

- name: Discover workload peers
  import_playbook: discover_peers.yml
  when: not (skip_frr_discovery | default(false) | bool)

- name: Deploy cloud infra (EVPN relay + WireGuard)
  hosts: cloud_infra
  become: true
  pre_tasks:
    # Needed so ansible_facts.services is populated for the roles' systemd-vs-podman branch (source-audit.md, "Missing service facts").
    - name: Gather service facts
      ansible.builtin.service_facts:
  roles:
    - evpn_cloud_infra
    - evpn_monitoring

- name: Deploy on-prem appliance (EVPN VTEP + VLAN trunk)
  hosts: onprem_appliances
  become: true
  pre_tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:
  roles:
    - evpn_onprem_appliance
    - evpn_monitoring

- name: Wait for EVPN convergence
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Wait 15 seconds for BGP EVPN to converge
      ansible.builtin.pause:
        seconds: 15

# skip_health leaves BGP proof to the caller. The kind peers lane has no VTEP prefixes
# and its discovered nodes are not SSH targets.
- name: Health checks
  hosts: all
  become: true
  ignore_unreachable: "{{ skip_health | default(false) | bool }}"
  tasks:
    - name: Run health checks
      ansible.builtin.include_role:
        name: evpn_health_check
      when: not (skip_health | default(false) | bool)
