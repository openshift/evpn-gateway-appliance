---
# Full deploy — idempotent, safe to re-run.
# Usage: ansible-playbook playbooks/deploy.yml
#
# Each role's input checks run before any play changes a host, so an invalid VLAN, ASN or transport
# setting fails while every host is still untouched.

- name: Validate appliance and relay inputs
  ansible.builtin.import_playbook: validate_inputs.yml

- name: Deploy cloud infra (EVPN relay + WireGuard)
  hosts: cloud_infra
  become: true
  pre_tasks:
    # Monitoring uses ansible_facts.services to select its runtime.
    - name: Gather service facts
      ansible.builtin.service_facts:
  roles:
    - evpn_cloud_infra
    - evpn_monitoring

- name: Deploy on-prem appliance (EVPN VTEP + VLAN trunk)
  hosts: onprem_appliances
  become: true
  pre_tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:
  roles:
    - evpn_onprem_appliance
    - evpn_monitoring

- name: Wait for EVPN convergence
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Wait 30 seconds for BGP EVPN to converge
      ansible.builtin.pause:
        seconds: 30

- name: Health checks
  hosts: cloud_infra:onprem_appliances
  become: true
  roles:
    - evpn_health_check
