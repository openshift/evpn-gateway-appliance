---
# Full deploy — idempotent, safe to re-run.
# Usage: ansible-playbook playbooks/deploy.yml

- name: Check and load the IPsec handoff
  hosts: onprem_appliances
  gather_facts: false
  any_errors_fatal: true
  tasks:
    # Before any host changes.
    - name: Gate IPsec with multihoming on CORENET-7502
      ansible.builtin.assert:
        that:
          - not (multihoming.enabled | default(false) | bool)
        fail_msg: tunnel.type ipsec with multihoming is gated until CORENET-7502 qualifies active-active forwarding over it.
      when: tunnel.type == 'ipsec'

    # Each appliance advertises its own VTEP network to AWS, so the TGW routes each VTEP to its own VPN.
    # The workload imports EVPN routes for the shared onprem ASN only.
    - name: Require IPsec appliances to share the transport and ASN and to have their own VTEPs
      ansible.builtin.assert:
        that:
          - _tunnels | map(attribute='type') | unique | length == 1
          - _hosts | map(attribute='bgp.onprem_asn') | unique | length == 1
          - _tunnels | map(attribute='onprem_ip') | unique | length == _tunnels | length
          # Merging the networks shrinks their total size only if two overlap.
          - _nets | map('ansible.utils.ipaddr', 'size') | sum == _nets | ansible.utils.cidr_merge | map('ansible.utils.ipaddr', 'size') | sum
          # AWS routes and security groups use the shared (localhost) tunnel.network_cidr.
          - _nets | reject('ansible.utils.subnet_of', _shared) | list | length == 0
        fail_msg: >-
          With several IPsec appliances, give them the same tunnel.type and bgp.onprem_asn, and set tunnel per host
          with its own onprem_ip and its own network_cidr containing it, within the shared tunnel.network_cidr.
      vars:
        _hosts: "{{ groups['onprem_appliances'] | map('extract', hostvars) | list }}"
        _tunnels: "{{ _hosts | map(attribute='tunnel') | list }}"
        _nets: "{{ _tunnels | map(attribute='network_cidr', default='10.44.44.0/24') | list }}"
        _shared: "{{ (hostvars['localhost'].tunnel | default(tunnel)).network_cidr | default('10.44.44.0/24') }}"
      run_once: true
      when: _tunnels | selectattr('type', 'equalto', 'ipsec') | list | length > 0

    - name: Load missing IPsec handoff from AWS
      delegate_to: localhost
      connection: local
      run_once: true
      become: false
      when:
        - tunnel.type == 'ipsec'
        - ansible_play_hosts | map('extract', hostvars) | selectattr('evpn_onprem_appliance_ipsec', 'undefined') | list | length > 0
      block:
        - name: Require the control-node credential context for VPN handoff
          ansible.builtin.assert:
            that:
              - hostvars['localhost'].ansible_connection | default('local') in ['local', 'ansible.builtin.local', 'ansible.legacy.local']
              - hostvars['localhost'].ansible_become | default(false) is ansible.builtin.falsy(convert_bool=true)
            fail_msg: VPN handoff requires local execution without privilege escalation to use controller credentials.
        - name: Read existing project VPN handoff
          ansible.builtin.include_role:
            name: evpn_aws_infra
            tasks_from: vpn_handoff

    # The handoff is keyed by customer gateway IP.
    - name: Pass each appliance its AWS VPN handoff in memory
      ansible.builtin.set_fact:
        evpn_onprem_appliance_ipsec: "{{ evpn_aws_infra_vpn[evpn_aws_infra_vpn_customer_gateway_ip] }}"
      when:
        - tunnel.type == 'ipsec'
        - evpn_onprem_appliance_ipsec is not defined
      no_log: true

- name: Deploy cloud infra (EVPN relay + WireGuard)
  hosts: cloud_infra
  become: true
  pre_tasks:
    # Needed so ansible_facts.services is populated for the roles' systemd-vs-podman branch (source-audit.md, "Missing service facts").
    - name: Gather service facts
      ansible.builtin.service_facts:
  roles:
    - evpn_cloud_infra
    - evpn_monitoring

- name: Deploy cloud workload (EVPN VTEP)
  hosts: cloud_workload
  become: true
  pre_tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:
  roles:
    - evpn_cloud_workload
    - evpn_monitoring

- name: Deploy on-prem appliance (EVPN VTEP + VLAN trunk)
  hosts: onprem_appliances
  become: true
  pre_tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:
  roles:
    - evpn_onprem_appliance
    - evpn_monitoring

- name: Wait for EVPN convergence
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Wait 15 seconds for BGP EVPN to converge
      ansible.builtin.pause:
        seconds: 15

- name: Health checks
  hosts: all
  become: true
  roles:
    - evpn_health_check
