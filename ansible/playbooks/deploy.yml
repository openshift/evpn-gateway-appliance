---
# Full deploy — idempotent, safe to re-run.
# Usage: ansible-playbook playbooks/deploy.yml

- name: Deploy cloud infra (EVPN relay + WireGuard)
  hosts: cloud_infra
  become: true
  pre_tasks:
    # Needed so ansible_facts.services is populated for the roles' systemd-vs-podman branch (source-audit.md, "Missing service facts").
    - name: Gather service facts
      ansible.builtin.service_facts:
  roles:
    - evpn_cloud_infra
    - evpn_monitoring

- name: Deploy cloud workload (EVPN VTEP)
  hosts: cloud_workload
  become: true
  pre_tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:
  roles:
    - evpn_cloud_workload
    - evpn_monitoring

- name: Deploy on-prem appliance (EVPN VTEP + VLAN trunk)
  hosts: onprem_appliances
  become: true
  pre_tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:
  roles:
    - evpn_onprem_appliance
    - evpn_monitoring

- name: Wait for EVPN convergence
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Wait 15 seconds for BGP EVPN to converge
      ansible.builtin.pause:
        seconds: 15

- name: Health checks
  hosts: all
  become: true
  roles:
    - evpn_health_check
