---
# Provision AWS infrastructure (VPCs, TGW, EC2) and update inventory.
#
# Uses the control-node AWS credential provider chain:
#   source <(aws configure export-credentials --format env)
#   export AWS_DEFAULT_REGION=eu-west-1
#
# Usage: ansible-playbook playbooks/provision-aws.yml

- name: Provision AWS infrastructure
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  environment:
    AWS_DEFAULT_REGION: "{{ aws_region | default('eu-west-1') }}"
  pre_tasks:
    - name: Require the control-node credential context
      ansible.builtin.assert:
        that:
          - ansible_connection | default('local') in ['local', 'ansible.builtin.local', 'ansible.legacy.local']
          - ansible_become | default(false) is ansible.builtin.falsy(convert_bool=true)
        fail_msg: Provisioning requires local execution without privilege escalation to use controller credentials.
  roles:
    - evpn_aws_infra

  post_tasks:
    - name: Update inventory file with new IPs
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../inventory/hosts.yml.j2"
        dest: "{{ playbook_dir }}/../inventory/hosts.yml"
        mode: "0644"
      when: infra_public_ip is defined and workload_public_ip is defined
