---
# Remove EVPN deployment configuration. Does NOT destroy cloud infrastructure.
# Usage: ansible-playbook playbooks/teardown.yml

- name: Teardown on-prem appliance
  hosts: onprem_appliances
  become: true
  tasks:
    - name: Tear down the on-prem appliance
      ansible.builtin.include_role:
        name: evpn_onprem_appliance
        tasks_from: teardown

- name: Teardown cloud infra
  hosts: cloud_infra
  become: true
  tasks:
    - name: Tear down the infra relay
      ansible.builtin.include_role:
        name: evpn_cloud_infra
        tasks_from: teardown
