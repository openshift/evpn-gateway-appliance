---
# Internet-mode transports leave a smaller inner MTU, and no MTU/MSS controls exist yet (CORENET-7709).
- name: "PREFLIGHT: Require acknowledgment of internet-mode limits"
  ansible.builtin.assert:
    # The argument spec's bool also takes y and t, which the bool filter reads as false.
    that: evpn_health_check_accept_internet_mode_limits is ansible.builtin.truthy(convert_bool=true)
    fail_msg: >-
      tunnel.type {{ tunnel.type }} crosses the internet: workload packets above
      {{ _evpn_health_check_workload_mtu_budget[tunnel.type] }} bytes are not supported (dropped or fragmented, untested;
      no MSS clamping until CORENET-7709), and latency and loss follow the internet path.
      {{ 'WireGuard is for development and test only. ' if tunnel.type == 'wireguard' else '' }}Set
      evpn_health_check_accept_internet_mode_limits to true to accept these limits.
  when: tunnel.type in ['wireguard', 'ipsec']

- name: "PREFLIGHT: Require the workload MTU to fit the transport"
  ansible.builtin.assert:
    that: 576 <= evpn_health_check_workload_mtu | int <= _evpn_health_check_workload_mtu_budget[tunnel.type]
    fail_msg: >-
      Set evpn_health_check_workload_mtu to the workload (CUDN and on-premises VLAN) IP MTU, from 576 (the CUDN API's minimum) to the
      {{ tunnel.type }} budget of {{ _evpn_health_check_workload_mtu_budget[tunnel.type] }} bytes (the transport's
      inner MTU minus 50 bytes of VXLAN); it is {{ evpn_health_check_workload_mtu }}.

- name: Check the Direct Connect inputs
  when: tunnel.type == 'direct-connect'
  vars:
    _evpn_health_check_dx_cidr: "{{ tunnel.network_cidr | default('10.44.44.0/24') }}"
    _evpn_health_check_dx_infra: "{{ infra_vpc_cidr | default('10.100.0.0/16') }}"
    _evpn_health_check_dx_workload: "{{ workload_vpc_cidr | default('10.200.0.0/16') }}"
    # IPv4 only: network_in_network matches across families.
    _evpn_health_check_dx_stretch_subnets: >-
      {{ stretches | default([], true) | selectattr('subnet', 'defined') | map(attribute='subnet') | ansible.utils.ipv4 }}
  block:
    # Direct Connect uses the one VTEP address (tunnel.onprem_ip) and one relay peering to it. Provisioning runs
    # this on localhost too, before any appliance is reachable.
    - name: "PREFLIGHT: Require one appliance without multihoming for Direct Connect"
      ansible.builtin.assert:
        that:
          - groups['onprem_appliances'] | default([]) | length <= 1
          - not (multihoming.enabled | default(false) | bool)
        fail_msg: >-
          tunnel.type direct-connect supports one on-premises appliance, without multihoming until CORENET-7502
          qualifies active-active forwarding over it.

    # network_in_network is false for a malformed network, which would pass the overlap checks below.
    - name: "PREFLIGHT: Require the VPC CIDRs to be IPv4 networks"
      ansible.builtin.assert:
        that:
          - _evpn_health_check_dx_infra | ansible.utils.ipv4('network/prefix') == _evpn_health_check_dx_infra
          - _evpn_health_check_dx_workload | ansible.utils.ipv4('network/prefix') == _evpn_health_check_dx_workload
        fail_msg: >-
          infra_vpc_cidr and workload_vpc_cidr must be IPv4 networks in canonical form; found
          {{ _evpn_health_check_dx_infra }} and {{ _evpn_health_check_dx_workload }}.

    - name: "PREFLIGHT: Require safe MTU mode for Direct Connect"
      ansible.builtin.assert:
        that: tunnel.mtu_mode | default('safe') == 'safe'
        fail_msg: >-
          tunnel.type direct-connect requires tunnel.mtu_mode safe (8500-byte transit VIFs) until CORENET-7709;
          found {{ tunnel.mtu_mode | default('safe') }}.

    # The AWS routes and security groups cover tunnel.network_cidr. AWS refuses a VPC route more specific
    # than the VPC's local route, and a network_cidr holding a VPC CIDR lets the VTEP sit inside the VPC.
    - name: "PREFLIGHT: Require the VTEP inside tunnel.network_cidr, outside the VPC CIDRs"
      ansible.builtin.assert:
        that:
          - tunnel.onprem_ip | ansible.utils.ipv4('address') == tunnel.onprem_ip
          - _evpn_health_check_dx_cidr | ansible.utils.ipv4('network/prefix') == _evpn_health_check_dx_cidr
          - tunnel.onprem_ip | ansible.utils.ipv4(_evpn_health_check_dx_cidr) == tunnel.onprem_ip
          - not (_evpn_health_check_dx_infra | ansible.utils.network_in_network(_evpn_health_check_dx_cidr))
          - not (_evpn_health_check_dx_workload | ansible.utils.network_in_network(_evpn_health_check_dx_cidr))
          - not (_evpn_health_check_dx_cidr | ansible.utils.network_in_network(_evpn_health_check_dx_infra))
          - not (_evpn_health_check_dx_cidr | ansible.utils.network_in_network(_evpn_health_check_dx_workload))
        fail_msg: >-
          tunnel.onprem_ip must be a plain IPv4 address inside tunnel.network_cidr, an IPv4 network outside the VPC
          CIDRs; found onprem_ip {{ tunnel.onprem_ip }}, network_cidr {{ _evpn_health_check_dx_cidr }}.

    - name: "PREFLIGHT: Require tunnel.next_hop outside tunnel.network_cidr and the VPC CIDRs"
      ansible.builtin.assert:
        that:
          - tunnel.next_hop | ansible.utils.ipv4('address') == tunnel.next_hop
          - not (_evpn_health_check_dx_cidr | ansible.utils.network_in_network(tunnel.next_hop))
          - not (_evpn_health_check_dx_infra | ansible.utils.network_in_network(tunnel.next_hop))
          - not (_evpn_health_check_dx_workload | ansible.utils.network_in_network(tunnel.next_hop))
          # Once its bridge exists, a stretch subnet holding next_hop would carry the VPC routes into the overlay.
          - _evpn_health_check_dx_nh_stretches | length == 0
        fail_msg: >-
          tunnel.next_hop must be the customer router's IPv4 address on the appliance's uplink, outside
          tunnel.network_cidr, the VPC CIDRs and the stretch subnets; found next_hop {{ tunnel.next_hop }}, network_cidr
          {{ _evpn_health_check_dx_cidr }}, VPC CIDRs {{ _evpn_health_check_dx_infra }} and
          {{ _evpn_health_check_dx_workload }}, stretch subnets {{ _evpn_health_check_dx_stretch_subnets }}.
      vars:
        _evpn_health_check_dx_nh_stretches: >-
          {%- set found = [] -%}
          {%- for s in _evpn_health_check_dx_stretch_subnets if s | ansible.utils.network_in_network(tunnel.next_hop) -%}
          {%- set _ = found.append(s) -%}
          {%- endfor -%}
          {{ found }}

    # The appliance's connected route for a stretch subnet inside a VPC CIDR would take that range from FRR's
    # static route, and the next preflight would refuse it as a foreign route.
    - name: "PREFLIGHT: Require the stretch subnets outside the VPC CIDRs"
      ansible.builtin.assert:
        that: _evpn_health_check_dx_stretch_overlaps | length == 0
        fail_msg: >-
          Stretch subnets must lie outside the VPC CIDRs {{ _evpn_health_check_dx_infra }} and
          {{ _evpn_health_check_dx_workload }}; found {{ _evpn_health_check_dx_stretch_overlaps }}.
      vars:
        _evpn_health_check_dx_stretch_overlaps: >-
          {%- set found = [] -%}
          {%- for s in _evpn_health_check_dx_stretch_subnets -%}
          {%- for c in [_evpn_health_check_dx_infra, _evpn_health_check_dx_workload]
                if s | ansible.utils.network_in_network(c) or c | ansible.utils.network_in_network(s) -%}
          {%- set _ = found.append(s) -%}
          {%- endfor -%}
          {%- endfor -%}
          {{ found | unique }}

    # AWS advertises the evpn_aws_infra VPC CIDRs, and FRR routes the shared ones.
    - name: "PREFLIGHT: Require the AWS role's VPC CIDRs to match the shared ones"
      ansible.builtin.assert:
        that:
          - evpn_aws_infra_infra_vpc_cidr | default(_evpn_health_check_dx_infra) == _evpn_health_check_dx_infra
          - evpn_aws_infra_workload_vpc_cidr | default(_evpn_health_check_dx_workload) == _evpn_health_check_dx_workload
        fail_msg: >-
          evpn_aws_infra_infra_vpc_cidr and evpn_aws_infra_workload_vpc_cidr, when set, must equal infra_vpc_cidr and
          workload_vpc_cidr; found evpn_aws_infra_infra_vpc_cidr
          {{ evpn_aws_infra_infra_vpc_cidr | default(_evpn_health_check_dx_infra) }}, evpn_aws_infra_workload_vpc_cidr
          {{ evpn_aws_infra_workload_vpc_cidr | default(_evpn_health_check_dx_workload) }}.

# Direct Connect: FRR owns the routes to the VPCs (see the evpn_onprem_appliance README).
- name: Check the Direct Connect underlay before deployment
  when:
    - "'onprem_appliances' in group_names"
    - tunnel.type == 'direct-connect'
  vars:
    # Deploy repeats this lookup (evpn_onprem_appliance) to name the uplink in FRR's onlink static routes.
    _evpn_health_check_dx_get: "{{ (_evpn_health_check_dx_nh_get.stdout | default('[{}]', true) | from_json)[0] }}"
  block:
    - name: "PREFLIGHT [onprem]: Look up tunnel.next_hop"
      ansible.builtin.command: ip -j route get {{ tunnel.next_hop }}
      register: _evpn_health_check_dx_nh_get
      changed_when: false
      check_mode: false
      failed_when: false

    - name: "PREFLIGHT [onprem]: Read the uplink MTU"
      ansible.builtin.command: cat /sys/class/net/{{ _evpn_health_check_dx_get.dev }}/mtu
      register: _evpn_health_check_dx_mtu
      changed_when: false
      check_mode: false
      when: _evpn_health_check_dx_get.dev is defined

    # More specific routes count too, and every protocol zebra did not install (-N: numeric).
    - name: "PREFLIGHT [onprem]: Find routes within the VPC CIDRs"
      ansible.builtin.command: ip -N -j route show root {{ item }}
      register: _evpn_health_check_dx_vpc_routes
      changed_when: false
      check_mode: false
      loop:
        - "{{ infra_vpc_cidr | default('10.100.0.0/16') }}"
        - "{{ workload_vpc_cidr | default('10.200.0.0/16') }}"

    # 1550 bytes carry VXLAN with a 1500-byte workload IP MTU (50 bytes of IPv4 VXLAN).
    - name: "PREFLIGHT [onprem]: Require a directly connected 1550-byte uplink and only FRR routes to the VPCs"
      ansible.builtin.assert:
        that:
          # A unicast host: not one of the appliance's own addresses or the subnet's broadcast address.
          - _evpn_health_check_dx_get.type | default('unicast') == 'unicast'
          - _evpn_health_check_dx_get.gateway is not defined
          # nmstate enslaves the trunk to trunk-br, which would drop the uplink's address.
          - _evpn_health_check_dx_get.dev | default('') not in [trunk_interface | default(''), 'trunk-br']
          # nmstate reparents trunk.<vlan> onto trunk-br and a stretch's br-vni bridge.
          - _evpn_health_check_dx_get.dev | default('') is not match('br-vni|trunk\\.')
          - _evpn_health_check_dx_mtu.stdout | default(0) | int >= 1550
          - _evpn_health_check_dx_foreign_routes | length == 0
        fail_msg: >-
          Direct Connect needs tunnel.next_hop {{ tunnel.next_hop }} to be another host on a directly connected uplink
          (not the trunk), reached over it without a gateway, with an MTU of at least 1550 (route get:
          {{ _evpn_health_check_dx_get }}; MTU {{ _evpn_health_check_dx_mtu.stdout | default('unknown') }}), and no
          routes within the VPC CIDRs except FRR's (found: {{ _evpn_health_check_dx_foreign_routes }}). When switching from
          another transport, run teardown.yml first.
      vars:
        # FRR's static routes are protocol 196 (Direct Connect peers no IPv4 unicast BGP); ip omits boot's.
        _evpn_health_check_dx_foreign_routes: >-
          {%- set found = [] -%}
          {%- for r in _evpn_health_check_dx_vpc_routes.results | map(attribute='stdout') | map('from_json') | flatten
                if r.protocol | default('boot') | string != '196' -%}
          {%- set _ = found.append(r.dst ~ ' proto ' ~ r.protocol | default('boot')) -%}
          {%- endfor -%}
          {{ found }}
