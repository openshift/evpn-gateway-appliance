---
# Health checks run on all hosts, but tasks are conditional on group membership.

# ═══════════════════════════════════════════════════════════════
# Common checks (all hosts)
# ═══════════════════════════════════════════════════════════════
- name: "HEALTH: FRR container is running"
  ansible.builtin.command: podman ps --format '{{ '{{' }}.Names{{ '}}' }}' --filter name=frr
  register: _frr_ps
  changed_when: false
  failed_when: "'frr' not in _frr_ps.stdout"

# ═══════════════════════════════════════════════════════════════
# Infra relay checks
# ═══════════════════════════════════════════════════════════════
- name: "HEALTH [infra]: WireGuard interface is up"
  ansible.builtin.command: wg show wg0
  register: _wg_show
  changed_when: false
  failed_when: "'latest handshake' not in _wg_show.stdout"
  when:
    - "'cloud_infra' in group_names"
    - tunnel.type == 'wireguard'

- name: "HEALTH [infra]: BGP session to workload is Established"
  ansible.builtin.shell: >
    podman exec frr vtysh -c "show bgp summary json" |
    python3 -c "import sys,json; d=json.load(sys.stdin);
    p=d['ipv4Unicast']['peers']['{{ hostvars['workload-router'].private_ip }}'];
    assert p['state']=='Established', f'state={p[\"state\"]}'"
  changed_when: false
  when: "'cloud_infra' in group_names"

- name: "HEALTH [infra]: BGP session to on-prem is Established"
  ansible.builtin.shell: >
    podman exec frr vtysh -c "show bgp summary json" |
    python3 -c "import sys,json; d=json.load(sys.stdin);
    p=d['ipv4Unicast']['peers']['{{ tunnel.onprem_ip }}'];
    assert p['state']=='Established', f'state={p[\"state\"]}'"
  changed_when: false
  when: "'cloud_infra' in group_names"

- name: "HEALTH [infra]: EVPN prefixes relayed from on-prem"
  ansible.builtin.shell: >
    podman exec frr vtysh -c "show bgp l2vpn evpn summary json" |
    python3 -c "import sys,json; d=json.load(sys.stdin);
    p=d['peers']['{{ tunnel.onprem_ip }}'];
    assert int(p['pfxRcd'])>0, f'pfxRcd={p[\"pfxRcd\"]}'"
  changed_when: false
  when: "'cloud_infra' in group_names"

- name: "HEALTH [infra]: EVPN prefixes relayed from workload"
  ansible.builtin.shell: >
    podman exec frr vtysh -c "show bgp l2vpn evpn summary json" |
    python3 -c "import sys,json; d=json.load(sys.stdin);
    p=d['peers']['{{ hostvars['workload-router'].private_ip }}'];
    assert int(p['pfxRcd'])>0, f'pfxRcd={p[\"pfxRcd\"]}'"
  changed_when: false
  when: "'cloud_infra' in group_names"

- name: "HEALTH [infra]: No VXLAN interfaces on relay"
  ansible.builtin.shell: ip -o link show | grep -c vxlan || echo 0
  register: _vxlan_count
  changed_when: false
  failed_when: _vxlan_count.stdout | int > 0
  when: "'cloud_infra' in group_names"

# ═══════════════════════════════════════════════════════════════
# Workload VTEP checks
# ═══════════════════════════════════════════════════════════════
- name: "HEALTH [workload]: BGP session to infra is Established"
  ansible.builtin.shell: >
    podman exec frr vtysh -c "show bgp summary json" |
    python3 -c "import sys,json; d=json.load(sys.stdin);
    p=d['ipv4Unicast']['peers']['{{ hostvars['infra-router'].private_ip }}'];
    assert p['state']=='Established', f'state={p[\"state\"]}'"
  changed_when: false
  when: "'cloud_workload' in group_names"

- name: "HEALTH [workload]: VNI {{ 10000 + item.vlan }} has remote VTEP"
  ansible.builtin.shell: >
    podman exec frr vtysh -c "show evpn vni {{ 10000 + item.vlan }}" |
    grep -A1 "Remote VTEPs" | grep -oP '\d+\.\d+\.\d+\.\d+'
  register: _remote_vtep
  changed_when: false
  failed_when: _remote_vtep.stdout == ""
  loop: "{{ stretches }}"
  loop_control:
    label: "VNI {{ 10000 + item.vlan }} ({{ item.name }})"
  when: "'cloud_workload' in group_names"

- name: "HEALTH [workload]: Ping on-prem gateway {{ item.onprem_gateway }}"
  ansible.builtin.command: ping -c 2 -W 3 -I {{ item.cloud_gateway }} {{ item.onprem_gateway }}
  register: _ping
  changed_when: false
  failed_when: _ping.rc != 0
  loop: "{{ stretches }}"
  loop_control:
    label: "{{ item.cloud_gateway }} → {{ item.onprem_gateway }}"
  when: "'cloud_workload' in group_names"

# ═══════════════════════════════════════════════════════════════
# On-prem appliance checks
# ═══════════════════════════════════════════════════════════════
- name: "HEALTH [onprem]: WireGuard interface is up"
  ansible.builtin.command: wg show wg0
  register: _wg_show
  changed_when: false
  failed_when: "'latest handshake' not in _wg_show.stdout"
  when:
    - "'onprem_appliances' in group_names"
    - tunnel.type == 'wireguard'

- name: "HEALTH [onprem]: BGP session to infra is Established"
  ansible.builtin.shell: >
    podman exec frr vtysh -c "show bgp summary json" |
    python3 -c "import sys,json; d=json.load(sys.stdin);
    p=d['ipv4Unicast']['peers']['{{ tunnel.cloud_ip }}'];
    assert p['state']=='Established', f'state={p[\"state\"]}'"
  changed_when: false
  when: "'onprem_appliances' in group_names"

- name: "HEALTH [onprem]: VNI {{ 10000 + item.vlan }} has remote VTEP"
  ansible.builtin.shell: >
    podman exec frr vtysh -c "show evpn vni {{ 10000 + item.vlan }}" |
    grep -A1 "Remote VTEPs" | grep -oP '\d+\.\d+\.\d+\.\d+'
  register: _remote_vtep
  changed_when: false
  failed_when: _remote_vtep.stdout == ""
  loop: "{{ stretches }}"
  loop_control:
    label: "VNI {{ 10000 + item.vlan }} ({{ item.name }})"
  when: "'onprem_appliances' in group_names"

- name: "HEALTH [onprem]: Ping cloud gateway {{ item.cloud_gateway }}"
  ansible.builtin.command: ping -c 2 -W 3 {{ item.cloud_gateway }}
  changed_when: false
  loop: "{{ stretches }}"
  loop_control:
    label: "→ {{ item.cloud_gateway }}"
  when: "'onprem_appliances' in group_names"

- name: "HEALTH [onprem]: Simulated VM can ping cloud gateway"
  ansible.builtin.command: >
    ip netns exec vm-{{ item.name }} ping -c 2 -W 3 {{ item.cloud_gateway }}
  changed_when: false
  loop: "{{ stretches }}"
  loop_control:
    label: "vm-{{ item.name }} → {{ item.cloud_gateway }}"
  when:
    - "'onprem_appliances' in group_names"
    - trunk_interface == "simulate"

- name: "HEALTH [onprem]: VLAN isolation — prod cannot reach staging VM"
  ansible.builtin.command: >
    ip netns exec vm-{{ stretches[0].name }} ping -c 1 -W 1 {{ stretches[1].subnet | regex_replace('.0/24$', '.10') }}
  register: _isolation
  changed_when: false
  failed_when: _isolation.rc == 0
  when:
    - "'onprem_appliances' in group_names"
    - trunk_interface == "simulate"
    - stretches | length >= 2
