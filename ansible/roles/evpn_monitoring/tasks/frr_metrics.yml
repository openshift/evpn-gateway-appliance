---
- name: Read monitoring.frr_exporter
  ansible.builtin.set_fact:
    _evpn_monitoring_frr_metrics_on: >-
      {{ monitoring.frr_exporter | default(none) is none or monitoring.frr_exporter | bool }}

- name: Remove the legacy FRR exporter container
  containers.podman.podman_container:
    name: frr_exporter
    state: absent

- name: Gather service facts for frr-metrics
  ansible.builtin.service_facts:
  when: ansible_facts.services is not defined

- name: Set the frr-metrics state
  ansible.builtin.systemd:
    name: frr-metrics.service
    enabled: "{{ _evpn_monitoring_frr_metrics_on }}"
    state: "{{ _evpn_monitoring_frr_metrics_on | ternary('started', 'stopped') }}"
  when: "'frr-metrics.service' in ansible_facts.services"

# Per-neighbor series need a configured peer, so don't wait for them. On images with
# metallb/frr-k8s#528, the BGP collector's scrape_success at 0 means a vtysh read or parse failed.
- name: Wait for frr-metrics to answer
  ansible.builtin.uri:
    url: http://127.0.0.1:7573/metrics
    return_content: true
    timeout: 10
  register: _evpn_monitoring_frr_metrics
  until:
    - _evpn_monitoring_frr_metrics.status == 200
    - _evpn_monitoring_frr_metrics.content is not search('(?m)^frrk8s_scrape_success\\{[^}]*collector="bgp"[^}]*\\} 0$')
  retries: 12
  delay: 5
  when:
    - _evpn_monitoring_frr_metrics_on
    - "'frr-metrics.service' in ansible_facts.services"
    - not ansible_check_mode
