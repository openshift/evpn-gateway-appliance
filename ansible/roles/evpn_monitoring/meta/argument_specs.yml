---
argument_specs:
  main:
    short_description: Configure frr-metrics, node_exporter and an optional overlay path probe for Prometheus scraping.
    description:
      - Controls the appliance image's frr-metrics.service.
      - Starts node-exporter via systemd when present, otherwise via Podman.
      - Optionally installs ega-path-probe.timer, which writes ega_path_probe_* metrics to
        node_exporter's textfile directory (see evpn_monitoring_path_probe_target).
    options:
      monitoring:
        type: dict
        required: true
        description: Which exporters to deploy.
        options:
          frr_exporter:
            type: bool
            description: >-
              Unset or true enables and starts frr-metrics.service where the unit exists;
              false stops and disables it.
          node_exporter:
            type: bool
            default: false
            description: Deploy the node exporter.
      evpn_monitoring_node_exporter_image:
        type: str
        default: quay.io/prometheus/node-exporter:v1.9.1
        description: Container image for the node exporter. Pin by tag or digest.
      evpn_monitoring_path_probe_target:
        type: str
        default: ""
        description: >-
          A stretch's cloud_gateway to ping every 30s through the overlay; the cloud side must hold
          it and answer ICMP echo. Set on onprem_appliances hosts with
          monitoring.node_exporter; when it is empty or node_exporter is off, the role removes an
          installed probe.
