---
- name: Detect bootc image
  ansible.builtin.command: bootc status --format=json
  register: evpn_cloud_workload_bootc_status
  changed_when: false
  failed_when: false

- name: Set bootc image fact
  ansible.builtin.set_fact:
    evpn_cloud_workload_bootc: "{{ evpn_cloud_workload_bootc_status.rc == 0 }}"

- name: Install packages (skipped on bootc images)
  ansible.builtin.dnf:
    name:
      - podman
      - tcpdump
      - traceroute
      - mtr
      - bind-utils
    state: present
  when:
    - ansible_facts.pkg_mgr in ['dnf', 'dnf5', 'yum']
    - not evpn_cloud_workload_bootc

- name: Enable IP forwarding
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: "1"
    sysctl_file: /etc/sysctl.d/99-ip-forward.conf
    reload: true
  loop:
    - net.ipv4.ip_forward
    - net.ipv4.conf.all.forwarding

- name: Create VXLAN interfaces
  ansible.builtin.command: >
    ip link add vxlan{{ 10000 + item.vlan }} type vxlan
    id {{ 10000 + item.vlan }}
    local {{ private_ip }}
    dstport 4789
    nolearning
  loop: "{{ stretches }}"
  loop_control:
    label: "VNI {{ 10000 + item.vlan }} ({{ item.name }})"
  register: _evpn_cloud_workload_vxlan_create
  failed_when: _evpn_cloud_workload_vxlan_create.rc != 0 and 'File exists' not in _evpn_cloud_workload_vxlan_create.stderr
  changed_when: _evpn_cloud_workload_vxlan_create.rc == 0

- name: Bring up VXLAN interfaces
  ansible.builtin.command: ip link set vxlan{{ 10000 + item.vlan }} up
  loop: "{{ stretches }}"
  loop_control:
    label: "vxlan{{ 10000 + item.vlan }}"
  changed_when: false

- name: Create per-VNI bridges
  ansible.builtin.command: ip link add br-vni{{ 10000 + item.vlan }} type bridge
  loop: "{{ stretches }}"
  loop_control:
    label: "br-vni{{ 10000 + item.vlan }}"
  register: _evpn_cloud_workload_br_create
  failed_when: _evpn_cloud_workload_br_create.rc != 0 and 'File exists' not in _evpn_cloud_workload_br_create.stderr
  changed_when: _evpn_cloud_workload_br_create.rc == 0

- name: Bring up bridges
  ansible.builtin.command: ip link set br-vni{{ 10000 + item.vlan }} up
  loop: "{{ stretches }}"
  loop_control:
    label: "br-vni{{ 10000 + item.vlan }}"
  changed_when: false

- name: Add VXLAN to bridge
  ansible.builtin.command: ip link set vxlan{{ 10000 + item.vlan }} master br-vni{{ 10000 + item.vlan }}
  loop: "{{ stretches }}"
  loop_control:
    label: "vxlan{{ 10000 + item.vlan }} → br-vni{{ 10000 + item.vlan }}"
  register: _evpn_cloud_workload_br_add
  failed_when: _evpn_cloud_workload_br_add.rc != 0 and 'already a member' not in _evpn_cloud_workload_br_add.stderr
  changed_when: _evpn_cloud_workload_br_add.rc == 0

- name: Assign IPs to bridge SVIs
  ansible.builtin.command: >-
    ip addr add {{ item.cloud_gateway }}/{{ item.subnet | ansible.utils.ipaddr('prefix') }}
    dev br-vni{{ 10000 + item.vlan }}
  loop: "{{ stretches }}"
  loop_control:
    label: "{{ item.cloud_gateway }} on br-vni{{ 10000 + item.vlan }}"
  register: _evpn_cloud_workload_ip_add
  failed_when: >-
    _evpn_cloud_workload_ip_add.rc != 0
    and 'already' not in _evpn_cloud_workload_ip_add.stderr
    and 'File exists' not in _evpn_cloud_workload_ip_add.stderr
  changed_when: _evpn_cloud_workload_ip_add.rc == 0

- name: Reconcile FRR configuration
  ansible.builtin.include_role:
    name: evpn_frr
  vars:
    evpn_frr_config_template: frr-workload-vtep.conf.j2

- name: Flush handlers
  ansible.builtin.meta: flush_handlers
