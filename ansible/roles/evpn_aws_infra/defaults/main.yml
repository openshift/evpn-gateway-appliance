---
evpn_aws_infra_aws_region: eu-west-1
evpn_aws_infra_project_name: evpn-poc

# VPC CIDRs: default to the shared fabric ranges that evpn_onprem_appliance's
# WireGuard AllowedIPs also read, so setting those once keeps both roles in sync.
evpn_aws_infra_infra_vpc_cidr: "{{ infra_vpc_cidr | default('10.100.0.0/16') }}"
evpn_aws_infra_workload_vpc_cidr: "{{ workload_vpc_cidr | default('10.200.0.0/16') }}"

# Instance config
evpn_aws_infra_router_instance_type: t3.small
evpn_aws_infra_ssh_key_name: bgp-poc

# AMI — CentOS Stream 10 (set evpn_aws_infra_router_ami to pin a specific image)
# If empty, the role looks up the latest CentOS Stream 10 AMI.
evpn_aws_infra_router_ami: ""

# Required: CIDR allowed SSH/WireGuard admin ingress. No safe default (source-audit.md §1, "SSH open to 0.0.0.0/0").
evpn_aws_infra_admin_cidr: ""
# Set true only for a disposable, fully isolated lab; never in CI.
evpn_aws_infra_allow_open_admin_cidr: false

# AWS Site-to-Site VPN (tunnel.type: ipsec). The collection's group_vars/all.yml sets the ASN from bgp.onprem_asn.
evpn_aws_infra_vpn_customer_gateway_ip: ""
evpn_aws_infra_vpn_customer_gateway_asn: 65044
evpn_aws_infra_vpn_tunnel_inside_cidrs:
  - 169.254.10.0/30
  - 169.254.11.0/30
