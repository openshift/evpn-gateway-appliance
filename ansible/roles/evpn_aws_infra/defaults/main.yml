---
evpn_aws_infra_aws_region: eu-west-1
evpn_aws_infra_project_name: evpn-poc

# VPC CIDRs — source inventory maps the shared fabric CIDRs to these inputs.
evpn_aws_infra_infra_vpc_cidr: 10.100.0.0/16
evpn_aws_infra_workload_vpc_cidr: 10.200.0.0/16

# Instance config
evpn_aws_infra_router_instance_type: t3.small
evpn_aws_infra_ssh_key_name: bgp-poc

# AMI — CentOS Stream 10 (set evpn_aws_infra_router_ami to pin a specific image)
# If empty, the role looks up the latest CentOS Stream 10 AMI.
evpn_aws_infra_router_ami: ""

# Required: CIDR allowed SSH/WireGuard admin ingress. No safe default (source-audit.md §1, "SSH open to 0.0.0.0/0").
evpn_aws_infra_admin_cidr: ""
# Set true only for a disposable, fully isolated lab; never in CI.
evpn_aws_infra_allow_open_admin_cidr: false
