---
- name: Restart WireGuard
  ansible.builtin.systemd:
    name: wg-quick@wg0
    state: restarted

# On the bootc image FRR runs as its own systemd unit (the embedded image); restart that.
# Fall back to podman-direct only when the unit isn't present (non-bootc host).
- name: Restart FRR via systemd (bootc image)
  ansible.builtin.systemd:
    name: frr-container.service
    state: restarted
  when: ansible_facts.services is defined and 'frr-container.service' in ansible_facts.services
  listen: Restart FRR

- name: Restart FRR via podman (non-bootc)
  containers.podman.podman_container:
    name: frr
    state: started
    restart: true
    image: "{{ frr_image }}"
    privileged: true
    network: host
    restart_policy: always
    volumes:
      - /etc/frr:/etc/frr:Z
      - /var/run/frr:/var/run/frr:Z
  when: not (ansible_facts.services is defined and 'frr-container.service' in ansible_facts.services)
  listen: Restart FRR
