---
argument_specs:
  main:
    short_description: Configure the on-prem EVPN appliance (VTEP, VLAN trunk, tunnel).
    description:
      - >-
        Brings up the on-prem side of the EVPN fabric: the transport endpoint,
        the VLAN trunk on a physical interface, per-stretch VXLAN interfaces
        and bridges, and FRR configured as the on-prem VTEP.
    options:
      infra_relay_host:
        type: str
        required: true
        description: Inventory hostname of the infra-VPC relay; WireGuard uses its ansible_host, IPsec EVPN uses its private_ip.
      evpn_onprem_appliance_ipsec:
        # The automatic role validation action prints type errors without censoring no_log values.
        # Document the schema here, but check it with secret-safe assertions under no_log in tasks/ipsec.yml.
        type: raw
        no_log: true
        description: >-
          Secret AWS VPN handoff, required for tunnel.type ipsec. Supply this appliance's entry of the
          evpn_aws_infra_vpn fact or an equivalent dict through Ansible Vault; never log or cache it.
        options:
          customer_gateway_ip:
            type: str
            required: true
            description: Customer gateway static public IPv4 address, used as the Libreswan leftid (also behind NAT).
          tunnels:
            type: list
            elements: dict
            required: true
            description: Exactly two distinct AWS tunnels with /30 inside networks in 169.254.0.0/16.
            options:
              outside_ip:
                type: str
                required: true
                description: AWS public IPv4 endpoint, used as right and rightid.
              inside_cidr:
                type: str
                required: true
                description: Canonical tunnel /30; tunnels are numbered ega-aws-1/2 and ipsec1/2 by this field, sorted as strings.
              aws_bgp_asn:
                type: int
                required: true
                description: AWS gateway BGP ASN, distinct from bgp.onprem_asn.
              cgw_bgp_asn:
                type: int
                required: true
                description: Customer gateway BGP ASN; must equal bgp.onprem_asn.
              secret_preshared_key:
                type: str
                required: true
                no_log: true
                description: Secret PSK from AWS (32 characters); 16-64 of [A-Za-z0-9._] (AWS allows 8, Libreswan in FIPS mode needs 16), not starting with 0.
      tunnel:
        type: dict
        required: true
        required_if:
          - [type, wireguard, [port, cloud_ip]]
          - [type, direct-connect, [next_hop]]
        description: >-
          Transport configuration parameters for the tunnel between on-prem and
          cloud; type, onprem_ip, cloud_ip, port and network_cidr are used to
          configure the transport endpoint and the FRR VTEP.
        options:
          type:
            type: str
            required: true
            choices: [wireguard, ipsec, direct-connect]
            description: Transport type. Determines which transport-specific configuration is applied.
          onprem_ip:
            type: str
            required: true
            description: Address of the on-prem appliance's VTEP (with WireGuard, also its tunnel address); also the BGP router-id.
          cloud_ip:
            type: str
            description: WireGuard tunnel address of the infra relay. IPsec and direct-connect use the relay private_ip instead.
          port:
            type: int
            description: WireGuard listen port. Used as the endpoint port to the infra relay.
          next_hop:
            type: str
            description: >-
              Direct Connect only; the customer router's address on the appliance's uplink. FRR routes infra_vpc_cidr
              and workload_vpc_cidr to it.
          network_cidr:
            type: str
            default: 10.44.44.0/24
            description: >-
              CIDR covering the tunnel addresses (onprem_ip and cloud_ip). Sets
              the WireGuard interface address prefix and the FRR BGP network
              statement and blackhole route; with ipsec, the only prefix
              advertised to AWS.
          mtu_mode:
            type: str
            choices: [safe, unsafe]
            description: Intended underlay MTU regime. Part of the shared playbook configuration model; not used by this role.
      infra_vpc_cidr:
        type: str
        default: 10.100.0.0/16
        description: CIDR of the infra VPC; routed to the cloud over the tunnel, or to tunnel.next_hop for direct-connect.
      workload_vpc_cidr:
        type: str
        default: 10.200.0.0/16
        description: CIDR of the workload VPC; routed to the cloud over the tunnel, or to tunnel.next_hop for direct-connect.
      ocp_pod_network_cidr:
        type: str
        default: 10.128.0.0/16
        description: >-
          CIDR of the OCP pod network in the workload VPC; routed to the cloud
          over the WireGuard tunnel; unused with ipsec and direct-connect. Override to match your cluster
          (OpenShift default is 10.128.0.0/14).
      stretches:
        type: list
        elements: dict
        required: true
        description: >-
          VLAN stretches extended between on-prem and cloud; the same list must
          be configured consistently across the fabric roles. vlan, name, subnet
          and onprem_gateway are used to build the per-stretch VXLAN interfaces
          and bridges.
        options:
          vlan:
            type: int
            required: true
            description: VLAN ID; the VNI is always 10000 + vlan. Used to build the per-stretch VXLAN interface and bridge.
          name:
            type: str
            required: true
            description: Human-readable stretch name. Used to name the per-stretch resources.
          subnet:
            type: str
            required: true
            description: IPv4 /24 subnet for this stretch. Used as the per-stretch bridge subnet.
          onprem_gateway:
            type: str
            required: true
            description: Gateway IP on the on-prem bridge SVI for this stretch. Assigned as the SVI gateway on the per-stretch bridge.
          cloud_gateway:
            type: str
            description: Gateway IP on the cloud workload side for this stretch. Part of the shared playbook configuration model; not used by this role.
      trunk_interface:
        type: str
        required: true
        description: >-
          Name of the tagged VLAN trunk interface to attach. The role enslaves it
          to the trunk bridge and builds a per-stretch VLAN sub-interface on it.
      bgp:
        type: dict
        required: true
        description: ASNs and limits for the three-tier BGP EVPN fabric.
        options:
          onprem_asn:
            type: int
            required: true
            description: BGP ASN of the on-prem appliance.
          infra_asn:
            type: int
            required: true
            description: BGP ASN of the infra relay.
          workload_asn:
            type: int
            required: true
            description: BGP ASN of the workload VTEP.
          max_prefix:
            type: int
            default: 1000
            description: Defensive maximum-prefix limit applied to EVPN neighbors.
