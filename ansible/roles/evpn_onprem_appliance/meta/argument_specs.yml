---
argument_specs:
  main:
    short_description: Configure the on-prem EVPN appliance (VTEP, VLAN trunk, tunnel).
    description:
      - >-
        Brings up the on-prem side of the EVPN fabric: the transport endpoint,
        the VLAN trunk (simulated veth/namespaces or a physical interface),
        per-stretch VXLAN interfaces and bridges, and FRR configured as the
        on-prem VTEP.
    options:
      infra_relay_host:
        type: str
        required: true
        description: Inventory hostname of the infra-VPC relay; its ansible_host is used as the transport endpoint.
      tunnel:
        type: dict
        required: true
        required_if:
          - [type, wireguard, [port]]
        description: >-
          Transport configuration parameters for the tunnel between on-prem and
          cloud; type, onprem_ip, cloud_ip, port and network_cidr are used to
          configure the transport endpoint and the FRR VTEP.
        options:
          type:
            type: str
            required: true
            choices: [wireguard, ipsec, direct-connect]
            description: Transport type. Determines which transport-specific configuration is applied.
          onprem_ip:
            type: str
            required: true
            description: Tunnel address of the on-prem appliance. Used as the VTEP and BGP router-id.
          cloud_ip:
            type: str
            required: true
            description: Tunnel address of the infra relay. Used as the FRR BGP neighbor.
          port:
            type: int
            description: WireGuard listen port. Used as the endpoint port to the infra relay.
          network_cidr:
            type: str
            default: 10.44.44.0/24
            description: >-
              CIDR covering the tunnel addresses (onprem_ip and cloud_ip). Sets
              the WireGuard interface address prefix and the FRR BGP network
              statement and blackhole route.
          mtu_mode:
            type: str
            choices: [safe, unsafe]
            description: Intended underlay MTU regime. Part of the shared playbook configuration model; not used by this role.
      infra_vpc_cidr:
        type: str
        default: 10.100.0.0/16
        description: CIDR of the infra VPC; routed to the cloud over the tunnel.
      workload_vpc_cidr:
        type: str
        default: 10.200.0.0/16
        description: CIDR of the workload VPC; routed to the cloud over the tunnel.
      ocp_pod_network_cidr:
        type: str
        default: 10.128.0.0/16
        description: >-
          CIDR of the OCP pod network in the workload VPC; routed to the cloud
          over the tunnel. Override to match your cluster (OpenShift default is
          10.128.0.0/14).
      stretches:
        type: list
        elements: dict
        required: true
        description: >-
          VLAN stretches extended between on-prem and cloud; the same list must
          be configured consistently across the fabric roles. vlan, name, subnet
          and onprem_gateway are used to build the per-stretch VXLAN interfaces
          and bridges.
        options:
          vlan:
            type: int
            required: true
            description: VLAN ID; the VNI is always 10000 + vlan. Used to build the per-stretch VXLAN interface and bridge.
          name:
            type: str
            required: true
            description: Human-readable stretch name. Used to name the per-stretch resources.
          subnet:
            type: str
            required: true
            description: IPv4 /24 subnet for this stretch. Used as the per-stretch bridge subnet.
          onprem_gateway:
            type: str
            required: true
            description: Gateway IP on the on-prem bridge SVI for this stretch. Assigned as the SVI gateway on the per-stretch bridge.
          cloud_gateway:
            type: str
            description: Gateway IP on the cloud workload side for this stretch. Part of the shared playbook configuration model; not used by this role.
      trunk_interface:
        type: str
        required: true
        description: >-
          "simulate" to build a veth/namespace trunk for local testing, or a
          real interface name to attach a physical trunk port.
      frr_image:
        type: str
        required: true
        description: Container image reference for the FRR VTEP. Pin by tag or digest.
      bgp:
        type: dict
        required: true
        description: ASNs and limits for the three-tier BGP EVPN fabric.
        options:
          onprem_asn:
            type: int
            required: true
            description: BGP ASN of the on-prem appliance.
          infra_asn:
            type: int
            required: true
            description: BGP ASN of the infra relay.
          workload_asn:
            type: int
            required: true
            description: BGP ASN of the workload VTEP.
          max_prefix:
            type: int
            default: 1000
            description: Defensive maximum-prefix limit applied to EVPN neighbors.
