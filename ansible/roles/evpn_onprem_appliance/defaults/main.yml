---
# FRR installs its own capability set at startup and exits if that fails, so grant
# its daemons' set plus what watchfrr needs. Mirrors image/rhel10/frr-container.service.
frr_container_caps:
  - NET_ADMIN
  - SYS_ADMIN
  - NET_RAW
  - NET_BIND_SERVICE
  - SETUID
  - SETGID
  - KILL
  - DAC_OVERRIDE
  - CHOWN
