---
- name: Check whether Libreswan is running
  ansible.builtin.stat:
    path: /run/pluto/pluto.ctl
  register: _evpn_onprem_appliance_ipsec_socket

- name: Read loaded IPsec connections
  ansible.builtin.command: ipsec connectionstatus
  register: _evpn_onprem_appliance_ipsec_connections
  changed_when: false
  check_mode: false
  # A socket left by a crashed pluto has no loaded connections to remove.
  failed_when: >-
    _evpn_onprem_appliance_ipsec_connections.rc != 0 and
    'connect(pluto_ctl) failed' not in (_evpn_onprem_appliance_ipsec_connections.stderr | default(''))
  when: _evpn_onprem_appliance_ipsec_socket.stat.exists

# delete removes the connection and its SAs, without stopping unrelated Libreswan connections.
- name: Stop and unload appliance IPsec connections
  ansible.builtin.command: "ipsec delete {{ item }}"
  loop:
    - ega-aws-1
    - ega-aws-2
  when:
    - _evpn_onprem_appliance_ipsec_socket.stat.exists
    - ('"' ~ item ~ '"') in _evpn_onprem_appliance_ipsec_connections.stdout
  changed_when: true

- name: Remove appliance Libreswan configuration
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/ipsec.d/ega-aws.conf
    - /etc/ipsec.d/ega-aws.secrets
    - /etc/ipsec.d/ega-aws.applied

- name: Reread Libreswan secrets after removing appliance keys
  ansible.builtin.command: ipsec rereadsecrets
  register: _evpn_onprem_appliance_ipsec_reread
  changed_when: false
  failed_when: >-
    _evpn_onprem_appliance_ipsec_reread.rc != 0 and
    'pluto is not running' not in (_evpn_onprem_appliance_ipsec_reread.stderr | default('') | lower) and
    'connect(pluto_ctl) failed' not in (_evpn_onprem_appliance_ipsec_reread.stderr | default(''))
  when:
    - _evpn_onprem_appliance_ipsec_socket.stat.exists
