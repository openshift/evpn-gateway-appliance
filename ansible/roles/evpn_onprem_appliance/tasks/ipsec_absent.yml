---
- name: Check whether Libreswan is running
  ansible.builtin.stat:
    path: /run/pluto/pluto.ctl
  register: _evpn_onprem_appliance_ipsec_socket

- name: Read loaded IPsec connections
  ansible.builtin.command: ipsec connectionstatus
  register: _evpn_onprem_appliance_ipsec_connections
  changed_when: false
  check_mode: false
  # whack waits forever on a stopped pluto; fail instead of hanging teardown.
  timeout: 60
  # A socket left by a crashed pluto has no loaded connections to remove.
  failed_when: >-
    _evpn_onprem_appliance_ipsec_connections.rc != 0 and
    'connect(pluto_ctl) failed' not in (_evpn_onprem_appliance_ipsec_connections.stderr | default(''))
  when: _evpn_onprem_appliance_ipsec_socket.stat.exists

# Drop the applied record first, so a deploy after an interrupted removal loads the connections again.
- name: Forget the applied appliance IPsec connections
  ansible.builtin.file:
    path: /etc/ipsec.d/ega-aws.applied
    state: absent

# Unload our connections without stopping unrelated Libreswan connections.
- name: Stop and unload appliance IPsec connections
  ansible.builtin.command: "ipsec delete {{ item }}"
  timeout: 60
  loop:
    - ega-aws-1
    - ega-aws-2
  when:
    - _evpn_onprem_appliance_ipsec_socket.stat.exists
    - ('"' ~ item ~ '"') in _evpn_onprem_appliance_ipsec_connections.stdout
  changed_when: true

- name: Check for the appliance Libreswan configuration
  ansible.builtin.stat:
    path: /etc/ipsec.d/ega-aws.conf
    get_attributes: false
    get_checksum: false
    get_mime: false
  register: _evpn_onprem_appliance_ipsec_conf

# Libreswan delete can leave policies, states and interfaces behind. Do not restart pluto. The configuration is
# removed only after this succeeds, so it marks the role's if_ids 1 and 2 as its own (other Libreswan connections
# may use them on a host where the role never configured IPsec) and makes a rerun retry a failed removal.
- name: Remove appliance IPsec kernel leftovers
  ansible.builtin.script:
    cmd: ega_aws_tunnels.py --remove
    executable: /usr/bin/python3
  register: _evpn_onprem_appliance_ipsec_remove
  changed_when: _evpn_onprem_appliance_ipsec_remove.stdout | trim == 'changed'
  failed_when: _evpn_onprem_appliance_ipsec_remove.rc != 0
  when: _evpn_onprem_appliance_ipsec_conf.stat.exists

- name: Remove appliance Libreswan configuration
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/ipsec.d/ega-aws.conf
    - /etc/ipsec.d/ega-aws.secrets
    - /etc/ipsec.d/ega-aws.lock

- name: Reread Libreswan secrets after removing appliance keys
  ansible.builtin.command: ipsec rereadsecrets
  register: _evpn_onprem_appliance_ipsec_reread
  timeout: 60
  changed_when: false
  failed_when: >-
    _evpn_onprem_appliance_ipsec_reread.rc != 0 and
    'pluto is not running' not in (_evpn_onprem_appliance_ipsec_reread.stderr | default('') | lower) and
    'connect(pluto_ctl) failed' not in (_evpn_onprem_appliance_ipsec_reread.stderr | default(''))
  when: _evpn_onprem_appliance_ipsec_socket.stat.exists
