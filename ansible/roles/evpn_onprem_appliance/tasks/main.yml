---
- name: Generate/load WireGuard keys
  # include_role (not a playbook_dir-relative path) so this resolves correctly once installed from a collection (ci-bootstrap-spec.md, "Cross-role include").
  ansible.builtin.include_role:
    name: evpn_cloud_infra
    tasks_from: wireguard_keys
  when: tunnel.type == 'wireguard'

- name: Install packages (skipped on bootc images)
  ansible.builtin.dnf:
    name: >-
      {{ ['podman', 'tcpdump', 'traceroute', 'mtr', 'bind-utils', 'nmstate']
         + (['wireguard-tools'] if tunnel.type == 'wireguard' else [])
         + (['libreswan'] if tunnel.type == 'ipsec' else []) }}
    state: present
  when: ansible_facts.pkg_mgr in ['dnf', 'dnf5', 'yum']

- name: Configure AWS IPsec tunnels
  ansible.builtin.include_tasks: ipsec.yml
  when: tunnel.type == 'ipsec'

# A host switched from IPsec would otherwise keep the AWS tunnels and their keys.
- name: Remove AWS IPsec configuration for other transports
  ansible.builtin.include_tasks: ipsec_absent.yml
  when: tunnel.type != 'ipsec'

- name: Enable IP forwarding
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: "1"
    sysctl_file: /etc/sysctl.d/99-ip-forward.conf
    reload: true
  loop:
    - net.ipv4.ip_forward
    - net.ipv4.conf.all.forwarding

- name: Deploy WireGuard client config
  no_log: true
  diff: false
  ansible.builtin.template:
    src: wg-client.conf.j2
    dest: /etc/wireguard/wg0.conf
    mode: "0600"
  notify: Restart WireGuard
  when: tunnel.type == 'wireguard'

- name: Enable and start WireGuard
  ansible.builtin.systemd:
    name: wg-quick@wg0
    state: started
    enabled: true
  when: tunnel.type == 'wireguard'

# A host switched from WireGuard would otherwise keep wg0 and its routes, which shadow the new transport.
- name: Stop and disable WireGuard for other transports
  ansible.builtin.systemd:
    name: wg-quick@wg0
    state: stopped
    enabled: false
  register: _evpn_onprem_appliance_wg_off
  failed_when: _evpn_onprem_appliance_wg_off.failed and 'Could not find' not in (_evpn_onprem_appliance_wg_off.msg | default(''))
  when: tunnel.type != 'wireguard'

# ── On-prem networking (nmstate) ────────────────────────────────
- name: Configure on-prem networking
  ansible.builtin.include_tasks: nm_networking.yml

# ── FRR ────────────────────────────────────────────────────────
- name: Reconcile FRR configuration
  ansible.builtin.include_role:
    name: evpn_frr
  vars:
    evpn_frr_config_template: frr-onprem-appliance.conf.j2

- name: Flush handlers
  ansible.builtin.meta: flush_handlers
