---
- name: Generate/load WireGuard keys
  # include_role (not a playbook_dir-relative path) so this resolves correctly once installed from a collection (ci-bootstrap-spec.md, "Cross-role include").
  ansible.builtin.include_role:
    name: evpn_cloud_infra
    tasks_from: wireguard_keys
  when: tunnel.type == 'wireguard'

- name: Install packages (skipped on bootc images)
  ansible.builtin.dnf:
    name: >-
      {{ ['podman', 'tcpdump', 'traceroute', 'mtr', 'bind-utils', 'nmstate']
         + (['wireguard-tools'] if tunnel.type == 'wireguard' else [])
         + (['libreswan'] if tunnel.type == 'ipsec' else []) }}
    state: present
  when: ansible_facts.pkg_mgr in ['dnf', 'dnf5', 'yum']

- name: Configure AWS IPsec tunnels
  ansible.builtin.include_tasks: ipsec.yml
  when: tunnel.type == 'ipsec'

# A host switched from IPsec would otherwise keep the AWS tunnels and their keys.
- name: Remove AWS IPsec configuration for other transports
  ansible.builtin.include_tasks: ipsec_absent.yml
  when: tunnel.type != 'ipsec'

- name: Enable IP forwarding
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: "1"
    sysctl_file: /etc/sysctl.d/99-ip-forward.conf
    reload: true
  loop:
    - net.ipv4.ip_forward
    - net.ipv4.conf.all.forwarding

- name: Deploy WireGuard client config
  no_log: true
  diff: false
  ansible.builtin.template:
    src: wg-client.conf.j2
    dest: /etc/wireguard/wg0.conf
    mode: "0600"
  notify: Restart WireGuard
  when: tunnel.type == 'wireguard'

- name: Enable and start WireGuard
  ansible.builtin.systemd:
    name: wg-quick@wg0
    state: started
    enabled: true
  when: tunnel.type == 'wireguard'

# A host switched from WireGuard would otherwise keep wg0 and its routes, which shadow the new transport.
- name: Stop and disable WireGuard for other transports
  ansible.builtin.systemd:
    name: wg-quick@wg0
    state: stopped
    enabled: false
  register: _evpn_onprem_appliance_wg_off
  failed_when: _evpn_onprem_appliance_wg_off.failed and 'Could not find' not in (_evpn_onprem_appliance_wg_off.msg | default(''))
  when: tunnel.type != 'wireguard'

# ── On-prem networking (nmstate) ────────────────────────────────
- name: Configure on-prem networking
  ansible.builtin.include_tasks: nm_networking.yml

# ── FRR ────────────────────────────────────────────────────────
- name: Ensure FRR directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop:
    - { path: /etc/frr, mode: '0755' }
    - { path: /var/run/frr, mode: '0777' }

- name: Deploy FRR daemons config
  ansible.builtin.copy:
    dest: /etc/frr/daemons
    mode: "0644"
    content: |
      bgpd=yes
      ospfd=no
      ospf6d=no
      ripd=no
      ripngd=no
      isisd=no
      pimd=no
      ldpd=no
      nhrpd=no
      eigrpd=no
      babeld=no
      sharpd=no
      pbrd=no
      bfdd=yes
      fabricd=no
      vrrpd=no
      pathd=no
  notify: Restart FRR

- name: Deploy FRR vtysh config
  ansible.builtin.copy:
    dest: /etc/frr/vtysh.conf
    mode: "0644"
    content: "service integrated-vtysh-config\n"

- name: Deploy FRR config (on-prem VTEP)
  ansible.builtin.template:
    src: frr-onprem-appliance.conf.j2
    dest: /etc/frr/frr.conf
    mode: "0644"
  notify: Restart FRR

- name: Start FRR via systemd service (bootc image)
  ansible.builtin.systemd:
    name: frr-container.service
    state: started
    enabled: true
  when: ansible_facts.services is defined and 'frr-container.service' in ansible_facts.services
  register: _evpn_onprem_appliance_frr_systemd

- name: Start FRR via podman directly (non-bootc)
  containers.podman.podman_container:
    name: frr
    image: "{{ frr_image }}"
    state: started
    restart_policy: always
    privileged: false
    cap_drop:
      - ALL
    cap_add: "{{ evpn_onprem_appliance_frr_container_caps }}"
    security_opt:
      - no-new-privileges
    network: host
    volumes:
      - /etc/frr:/etc/frr:Z
      - /var/run/frr:/var/run/frr:Z
  when: _evpn_onprem_appliance_frr_systemd is skipped

- name: Flush handlers
  ansible.builtin.meta: flush_handlers
