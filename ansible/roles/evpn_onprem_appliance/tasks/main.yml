---
- name: Generate/load WireGuard keys
  # include_role (not a playbook_dir-relative path) so this resolves correctly once installed from a collection (ci-bootstrap-spec.md, "Cross-role include").
  ansible.builtin.include_role:
    name: evpn_cloud_infra
    tasks_from: wireguard_keys
  when: tunnel.type == 'wireguard'

- name: Install packages (skipped on bootc images)
  ansible.builtin.dnf:
    name: >-
      {{ ['podman', 'tcpdump', 'traceroute', 'mtr', 'bind-utils']
         + (['wireguard-tools'] if tunnel.type == 'wireguard' else []) }}
    state: present
  when: ansible_facts.pkg_mgr in ['dnf', 'dnf5', 'yum']

- name: Enable IP forwarding
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: "1"
    sysctl_file: /etc/sysctl.d/99-ip-forward.conf
    reload: true
  loop:
    - net.ipv4.ip_forward
    - net.ipv4.conf.all.forwarding

- name: Deploy WireGuard client config
  no_log: true
  diff: false
  ansible.builtin.template:
    src: wg-client.conf.j2
    dest: /etc/wireguard/wg0.conf
    mode: "0600"
  notify: Restart WireGuard
  when: tunnel.type == 'wireguard'

- name: Enable and start WireGuard
  ansible.builtin.systemd:
    name: wg-quick@wg0
    state: started
    enabled: true
  when: tunnel.type == 'wireguard'

# ── Trunk + VLAN setup ──────────────────────────────────────────
- name: Configure all-active multihoming bond
  ansible.builtin.include_tasks: multihoming.yml
  when: multihoming.enabled | default(false) | bool

- name: Set up physical trunk
  ansible.builtin.include_tasks: physical.yml

# ── Per-stretch VXLAN + Bridge ──────────────────────────────────
- name: Create VXLAN interfaces
  ansible.builtin.command: >
    ip link add vxlan{{ 10000 + item.vlan }} type vxlan
    id {{ 10000 + item.vlan }}
    local {{ tunnel.onprem_ip }}
    dstport 4789
    nolearning
  loop: "{{ stretches }}"
  loop_control:
    label: "VNI {{ 10000 + item.vlan }} ({{ item.name }})"
  register: _vxlan_create
  failed_when: _vxlan_create.rc != 0 and 'File exists' not in _vxlan_create.stderr
  changed_when: _vxlan_create.rc == 0
  when: not (multihoming.enabled | default(false) | bool)

- name: Bring up VXLAN interfaces
  ansible.builtin.command: ip link set vxlan{{ 10000 + item.vlan }} up
  loop: "{{ stretches }}"
  loop_control:
    label: "vxlan{{ 10000 + item.vlan }}"
  changed_when: false
  when: not (multihoming.enabled | default(false) | bool)

- name: Create the multihoming shared external VXLAN device
  ansible.builtin.command: >-
    ip link add vxlan0 type vxlan dstport 4789 local {{ tunnel.onprem_ip }}
    nolearning external vnifilter
  register: _mh_vxlan_create
  failed_when: _mh_vxlan_create.rc != 0 and 'File exists' not in _mh_vxlan_create.stderr
  changed_when: _mh_vxlan_create.rc == 0
  when: multihoming.enabled | default(false) | bool

- name: Configure the multihoming shared VXLAN device
  ansible.builtin.shell: |
    set -e
    ip link set vxlan0 master trunk-br
    bridge link set dev vxlan0 vlan_tunnel on neigh_suppress on learning off
    ip link set vxlan0 up
  args:
    executable: /bin/bash
  changed_when: true
  when: multihoming.enabled | default(false) | bool

- name: Create per-VNI bridges
  ansible.builtin.command: ip link add br-vni{{ 10000 + item.vlan }} type bridge
  loop: "{{ stretches }}"
  loop_control:
    label: "br-vni{{ 10000 + item.vlan }}"
  register: _br_create
  failed_when: _br_create.rc != 0 and 'File exists' not in _br_create.stderr
  changed_when: _br_create.rc == 0
  when: not (multihoming.enabled | default(false) | bool)

- name: Bring up bridges
  ansible.builtin.command: ip link set br-vni{{ 10000 + item.vlan }} up
  loop: "{{ stretches }}"
  loop_control:
    label: "br-vni{{ 10000 + item.vlan }}"
  changed_when: false
  when: not (multihoming.enabled | default(false) | bool)

- name: Add VLAN sub-interface to bridge
  ansible.builtin.command: ip link set trunk.{{ item.vlan }} master br-vni{{ 10000 + item.vlan }}
  loop: "{{ stretches }}"
  loop_control:
    label: "trunk.{{ item.vlan }} → br-vni{{ 10000 + item.vlan }}"
  register: _trunk_add
  failed_when: _trunk_add.rc != 0 and 'already a member' not in _trunk_add.stderr
  changed_when: _trunk_add.rc == 0
  when: not (multihoming.enabled | default(false) | bool)

- name: Add VXLAN to bridge
  ansible.builtin.command: ip link set vxlan{{ 10000 + item.vlan }} master br-vni{{ 10000 + item.vlan }}
  loop: "{{ stretches }}"
  loop_control:
    label: "vxlan{{ 10000 + item.vlan }} → br-vni{{ 10000 + item.vlan }}"
  register: _vx_add
  failed_when: _vx_add.rc != 0 and 'already a member' not in _vx_add.stderr
  changed_when: _vx_add.rc == 0
  when: not (multihoming.enabled | default(false) | bool)

- name: Assign IPs to bridge SVIs
  ansible.builtin.command: >-
    ip addr add {{ item.onprem_gateway }}/{{ item.subnet | ansible.utils.ipaddr('prefix') }}
    dev br-vni{{ 10000 + item.vlan }}
  loop: "{{ stretches }}"
  loop_control:
    label: "{{ item.onprem_gateway }} on br-vni{{ 10000 + item.vlan }}"
  register: _ip_add
  failed_when: _ip_add.rc != 0 and 'already' not in _ip_add.stderr and 'File exists' not in _ip_add.stderr
  changed_when: _ip_add.rc == 0
  when: not (multihoming.enabled | default(false) | bool)

# EVPN-MH requires the ES bond and its VNI-bearing interfaces to be visible in
# the same VLAN-aware bridge domain. The legacy per-VNI bridge layout above is
# retained for non-MH deployments; multihoming uses trunk-br as the shared
# bridge and the existing trunk.<vlan> interfaces as its SVIs.
- name: Map multihoming VLANs to VNIs on the shared VXLAN device
  ansible.builtin.shell: |
    set -e
    bridge vlan add vid {{ item.vlan }} dev trunk-br self
    bridge vlan add vid {{ item.vlan }} dev vxlan0
    bridge vni add dev vxlan0 vni {{ 10000 + item.vlan }}
    bridge vlan add vid {{ item.vlan }} dev vxlan0 tunnel_info id {{ 10000 + item.vlan }}
  args:
    executable: /bin/bash
  loop: "{{ stretches }}"
  loop_control:
    label: "VLAN {{ item.vlan }} ↔ VNI {{ 10000 + item.vlan }}"
  changed_when: true
  when: multihoming.enabled | default(false) | bool

- name: Assign multihoming SVIs to the shared VLAN-aware bridge
  ansible.builtin.command: >-
    ip addr add {{ item.onprem_gateway }}/{{ item.subnet | ansible.utils.ipaddr('prefix') }}
    dev trunk.{{ item.vlan }}
  loop: "{{ stretches }}"
  loop_control:
    label: "{{ item.onprem_gateway }} on trunk.{{ item.vlan }}"
  register: _mh_ip_add
  failed_when: _mh_ip_add.rc != 0 and 'already' not in _mh_ip_add.stderr and 'File exists' not in _mh_ip_add.stderr
  changed_when: _mh_ip_add.rc == 0
  when: multihoming.enabled | default(false) | bool

- name: Render FRR configuration
  ansible.builtin.include_tasks: frr_config.yml

- name: Start FRR via systemd service (bootc image)
  ansible.builtin.systemd:
    name: frr-container.service
    state: started
    enabled: true
  when: ansible_facts.services is defined and 'frr-container.service' in ansible_facts.services
  register: _frr_systemd

- name: Start FRR via podman directly (non-bootc)
  containers.podman.podman_container:
    name: frr
    image: "{{ frr_image }}"
    state: started
    restart_policy: always
    privileged: true
    network: host
    volumes:
      - /etc/frr:/etc/frr:Z
      - /var/run/frr:/var/run/frr:Z
  when: _frr_systemd is skipped

- name: Flush handlers
  ansible.builtin.meta: flush_handlers
