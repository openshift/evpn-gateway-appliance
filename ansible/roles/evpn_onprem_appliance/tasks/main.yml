---
- name: Validate all-active multihoming configuration
  ansible.builtin.include_tasks: multihoming.yml
  when: multihoming.enabled | default(false) | bool

- name: Detect bootc image
  ansible.builtin.command: bootc status --format=json
  register: evpn_onprem_appliance_bootc_status
  changed_when: false
  failed_when: false

- name: Set bootc image fact
  ansible.builtin.set_fact:
    evpn_onprem_appliance_bootc: "{{ evpn_onprem_appliance_bootc_status.rc == 0 }}"

- name: Generate/load WireGuard keys
  # include_role (not a playbook_dir-relative path) so this resolves correctly once installed from a collection (ci-bootstrap-spec.md, "Cross-role include").
  ansible.builtin.include_role:
    name: evpn_cloud_infra
    tasks_from: wireguard_keys
  when: tunnel.type == 'wireguard'

- name: Install packages (skipped on bootc images)
  ansible.builtin.dnf:
    name: >-
      {{ ['podman', 'tcpdump', 'traceroute', 'mtr', 'bind-utils', 'nmstate']
         + (['wireguard-tools'] if tunnel.type == 'wireguard' else []) }}
    state: present
  when:
    - ansible_facts.pkg_mgr in ['dnf', 'dnf5', 'yum']
    - not evpn_onprem_appliance_bootc

- name: Enable IP forwarding
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: "1"
    sysctl_file: /etc/sysctl.d/99-ip-forward.conf
    reload: true
  loop:
    - net.ipv4.ip_forward
    - net.ipv4.conf.all.forwarding

- name: Deploy WireGuard client config
  no_log: true
  diff: false
  ansible.builtin.template:
    src: wg-client.conf.j2
    dest: /etc/wireguard/wg0.conf
    mode: "0600"
  notify: Restart WireGuard
  when: tunnel.type == 'wireguard'

- name: Enable and start WireGuard
  ansible.builtin.systemd:
    name: wg-quick@wg0
    state: started
    enabled: true
  when: tunnel.type == 'wireguard'

# ── On-prem networking (nmstate) ────────────────────────────────
- name: Configure on-prem networking
  ansible.builtin.include_tasks: nm_networking.yml

- name: Validate the configured multihoming bond
  ansible.builtin.include_tasks: multihoming_validate.yml
  when: multihoming.enabled | default(false) | bool

# ── FRR ────────────────────────────────────────────────────────
- name: Reconcile FRR configuration
  ansible.builtin.include_role:
    name: evpn_frr
  vars:
    evpn_frr_config_template: frr-onprem-appliance.conf.j2

- name: Flush handlers
  ansible.builtin.meta: flush_handlers
