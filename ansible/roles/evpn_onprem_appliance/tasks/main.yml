---
- name: Generate/load WireGuard keys
  # include_role (not a playbook_dir-relative path) so this resolves correctly once installed from a collection (ci-bootstrap-spec.md, "Cross-role include").
  ansible.builtin.include_role:
    name: evpn_cloud_infra
    tasks_from: wireguard_keys
  when: tunnel.type == 'wireguard'

- name: Install packages (skipped on bootc images)
  ansible.builtin.dnf:
    name: >-
      {{ ['podman', 'tcpdump', 'traceroute', 'mtr', 'bind-utils', 'nmstate']
         + (['wireguard-tools'] if tunnel.type == 'wireguard' else []) }}
    state: present
  when: ansible_facts.pkg_mgr in ['dnf', 'dnf5', 'yum']

- name: Enable IP forwarding
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: "1"
    sysctl_file: /etc/sysctl.d/99-ip-forward.conf
    reload: true
  loop:
    - net.ipv4.ip_forward
    - net.ipv4.conf.all.forwarding

- name: Deploy WireGuard client config
  no_log: true
  diff: false
  ansible.builtin.template:
    src: wg-client.conf.j2
    dest: /etc/wireguard/wg0.conf
    mode: "0600"
  notify: Restart WireGuard
  when: tunnel.type == 'wireguard'

- name: Enable and start WireGuard
  ansible.builtin.systemd:
    name: wg-quick@wg0
    state: started
    enabled: true
  when: tunnel.type == 'wireguard'

# ── Persistent all-active multihoming bond ──────────────────────
- name: Configure all-active multihoming bond
  ansible.builtin.include_tasks: multihoming.yml
  when: multihoming.enabled | default(false) | bool

# ── On-prem networking (nmstate) ────────────────────────────────
- name: Configure on-prem networking
  ansible.builtin.include_tasks: nm_networking.yml
  when: not (multihoming.enabled | default(false) | bool)

# The current nmstate path owns the normal per-VNI layout. Multihoming uses the shared
# VLAN-aware trunk bridge with one fixed-VNI VXLAN device per stretch, attached as an
# access port. This avoids requiring the SVD-only external/vni-filter/vlan_tunnel
# netlink attributes.
- name: Set up physical multihoming trunk
  ansible.builtin.include_tasks: physical.yml
  when: multihoming.enabled | default(false) | bool

- name: Create one fixed-VNI VXLAN device per multihoming stretch
  ansible.builtin.command: >-
    ip link add vxlan{{ 10000 + item.vlan }} type vxlan id {{ 10000 + item.vlan }}
    dstport 4789 local {{ tunnel.onprem_ip }} nolearning
  register: _mh_vxlan_create
  failed_when: _mh_vxlan_create.rc != 0 and 'File exists' not in _mh_vxlan_create.stderr
  changed_when: _mh_vxlan_create.rc == 0
  loop: "{{ stretches }}"
  loop_control:
    label: "VNI {{ 10000 + item.vlan }}"
  when: multihoming.enabled | default(false) | bool

- name: Configure fixed-VNI VXLAN devices as access ports
  ansible.builtin.shell: |
    set -e
    dev=vxlan{{ 10000 + item.vlan }}
    ip link set "$dev" master trunk-br
    bridge vlan del vid 1 dev "$dev" 2>/dev/null || true
    bridge vlan add vid {{ item.vlan }} dev "$dev" pvid untagged
    bridge link set dev "$dev" neigh_suppress on learning off
    ip link set "$dev" up
  args:
    executable: /bin/bash
  loop: "{{ stretches }}"
  loop_control:
    label: "VLAN {{ item.vlan }} access port"
  changed_when: true
  when: multihoming.enabled | default(false) | bool

- name: Admit multihoming VLANs on the shared bridge
  ansible.builtin.shell: |
    set -e
    bridge vlan add vid {{ item.vlan }} dev trunk-br self
  args:
    executable: /bin/bash
  loop: "{{ stretches }}"
  loop_control:
    label: "VLAN {{ item.vlan }} ↔ VNI {{ 10000 + item.vlan }}"
  changed_when: true
  when: multihoming.enabled | default(false) | bool

- name: Assign multihoming SVIs to the shared VLAN-aware bridge
  ansible.builtin.command: >-
    ip addr add {{ item.onprem_gateway }}/{{ item.subnet | ansible.utils.ipaddr('prefix') }}
    dev trunk.{{ item.vlan }}
  loop: "{{ stretches }}"
  loop_control:
    label: "{{ item.onprem_gateway }} on trunk.{{ item.vlan }}"
  register: _mh_ip_add
  failed_when: _mh_ip_add.rc != 0 and 'already' not in _mh_ip_add.stderr and 'File exists' not in _mh_ip_add.stderr
  changed_when: _mh_ip_add.rc == 0
  when: multihoming.enabled | default(false) | bool

- name: Discover multihoming appliance peers from inventory
  ansible.builtin.set_fact:
    _evpn_mh_peer_addresses: >-
      {{
        multihoming.peer_addresses
        | default(
            groups['onprem_appliances'] | default([])
            | map('extract', hostvars, 'evpn_underlay_ip')
            | reject('undefined')
            | reject('equalto', evpn_underlay_ip | default(''))
            | list,
            true
          )
      }}
  when: multihoming.enabled | default(false) | bool

- name: Render FRR configuration
  ansible.builtin.include_tasks: frr_config.yml

- name: Start FRR via systemd service (bootc image)
  ansible.builtin.systemd:
    name: frr-container.service
    state: started
    enabled: true
  when: ansible_facts.services is defined and 'frr-container.service' in ansible_facts.services
  register: _evpn_onprem_appliance_frr_systemd

- name: Start FRR via podman directly (non-bootc)
  containers.podman.podman_container:
    name: frr
    image: "{{ frr_image }}"
    state: started
    restart_policy: always
    privileged: false
    cap_drop:
      - ALL
    cap_add: "{{ evpn_onprem_appliance_frr_container_caps }}"
    security_opt:
      - no-new-privileges
    network: host
    volumes:
      - /etc/frr:/etc/frr:Z
      - /var/run/frr:/var/run/frr:Z
  when: _evpn_onprem_appliance_frr_systemd is skipped

- name: Flush handlers
  ansible.builtin.meta: flush_handlers
