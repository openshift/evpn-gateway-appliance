---
# Tear down everything main.yml deploys, in reverse: the FRR / exporter containers, the WireGuard
# tunnel or AWS IPsec connections, the on-prem networking and the FRR config. The container/service
# stops ignore errors so a partial deploy still tears down cleanly.
# On the bootc image systemd runs FRR with Restart=always; stop it first, or it relaunches the container removed next.
- name: Stop and disable the FRR service (bootc image)
  ansible.builtin.systemd:
    name: frr-container.service
    state: stopped
    enabled: false
  register: _evpn_onprem_appliance_frr_unit_stop
  failed_when: >-
    _evpn_onprem_appliance_frr_unit_stop.failed and
    'Could not find' not in (_evpn_onprem_appliance_frr_unit_stop.msg | default(''))

- name: Stop and remove FRR container
  containers.podman.podman_container:
    name: frr
    state: absent

# FRR leaves its static routes (protocol 196) in the kernel when it stops: Direct Connect's VPC routes use the
# uplink, which teardown keeps, so VPC traffic would still go to tunnel.next_hop; and every transport's
# tunnel.network_cidr blackhole would drop that network's traffic.
- name: Remove FRR's static routes
  ansible.builtin.command: ip route del {{ item }} proto 196
  loop:
    - "{{ infra_vpc_cidr | default('10.100.0.0/16') }}"
    - "{{ workload_vpc_cidr | default('10.200.0.0/16') }}"
    - "{{ tunnel.network_cidr | default('10.44.44.0/24') }}"
  register: _evpn_onprem_appliance_frr_route_del
  # The error text below is glibc's, which a language pack would translate.
  environment:
    LC_ALL: C
  changed_when: _evpn_onprem_appliance_frr_route_del.rc == 0
  failed_when: _evpn_onprem_appliance_frr_route_del.rc != 0 and 'No such process' not in _evpn_onprem_appliance_frr_route_del.stderr

- name: Undo the Direct Connect ARP setting
  ansible.builtin.include_tasks: dx_arp_clear.yml

- name: Stop and remove frr_exporter container
  containers.podman.podman_container:
    name: frr_exporter
    state: absent

- name: Stop and remove node_exporter container
  containers.podman.podman_container:
    name: node_exporter
    state: absent

- name: Stop WireGuard
  ansible.builtin.systemd:
    name: wg-quick@wg0
    state: stopped
    enabled: false
  register: _evpn_onprem_appliance_wg_stop
  failed_when: _evpn_onprem_appliance_wg_stop.failed and 'Could not find' not in (_evpn_onprem_appliance_wg_stop.msg | default(''))

- name: Remove AWS IPsec host configuration
  ansible.builtin.include_tasks: ipsec_absent.yml

# Tear down the on-prem networking declaratively, mirroring deploy: render the template with no stretches
# and apply it. _evpn_onprem_appliance_absent is every ega-* interface we own (marked absent); _evpn_onprem_appliance_detach is every
# interface enslaved to trunk-br (teardown has no desired trunk, so all), detached with controller: "" to
# clear the controller from the trunk's foreign profile.
- name: Read the current network state
  ansible.builtin.command: nmstatectl show
  register: _evpn_onprem_appliance_state
  changed_when: false

- name: Build the list of appliance-owned interfaces to remove
  ansible.builtin.set_fact:
    _evpn_onprem_appliance_absent: >-
      {{ (_evpn_onprem_appliance_state.stdout | from_yaml).interfaces
         | selectattr('profile-name', 'defined')
         | selectattr('profile-name', 'match', '^ega-')
         | map(attribute='name') | list }}

- name: Build the detach list (every interface enslaved to trunk-br)
  ansible.builtin.set_fact:
    _evpn_onprem_appliance_detach: >-
      {{ (_evpn_onprem_appliance_state.stdout | from_yaml).interfaces
         | selectattr('controller', 'defined')
         | selectattr('controller', 'equalto', 'trunk-br')
         | map(attribute='name') | list }}

- name: Render the teardown nmstate desired state (no stretches, everything owned absent + trunk detached)
  ansible.builtin.template:
    src: nmstate.yml.j2
    dest: /var/lib/ega/nmstate-teardown.yaml
    mode: "0600"
  vars:
    stretches: []
    _evpn_onprem_appliance_teardown: true
  when: _evpn_onprem_appliance_absent | length > 0 or _evpn_onprem_appliance_detach | length > 0

- name: Apply the teardown nmstate desired state
  ansible.builtin.command: nmstatectl apply /var/lib/ega/nmstate-teardown.yaml
  when: _evpn_onprem_appliance_absent | length > 0 or _evpn_onprem_appliance_detach | length > 0
  changed_when: true

- name: Remove NetworkManager dispatchers
  ansible.builtin.file:
    path: "/etc/NetworkManager/dispatcher.d/{{ item }}"
    state: absent
  loop:
    - 90-ega-neigh-suppress
    - 90-ega-trunk-vlans

- name: Remove FRR config
  ansible.builtin.file:
    path: /etc/frr
    state: absent
