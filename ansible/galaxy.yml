---
namespace: network
name: evpn_gateway
version: 0.1.0
readme: README.md
authors:
  - OpenShift Core Networking
description: >-
  Deploy and configure the EVPN Gateway Appliance (EGA): on-prem appliance,
  AWS infra/workload relays, and the BGP EVPN fabric connecting them.
license:
  - Apache-2.0
tags:
  - networking
  - evpn
  - bgp
  - frr
  - aws
repository: https://github.com/openshift/evpn-gateway-appliance
homepage: https://github.com/openshift/evpn-gateway-appliance
issues: https://github.com/openshift/evpn-gateway-appliance/issues

dependencies:
  containers.podman: ">=1.10.0"
  ansible.posix: ">=1.5.0"
  amazon.aws: ">=7.0.0"
  ansible.utils: ">=2.10.0"   # ipsubnet/ipaddr/ipmath filters; was used but undeclared (source-audit.md-style gap, fixed here).

# Deny-list, no negation — keep lab/dev-only paths out of the published tarball (source-audit.md §0).
build_ignore:
  # Directory patterns must NOT have a trailing slash — ansible-galaxy matches
  # build_ignore with fnmatch, and "inventory/" fails to match the directory,
  # which would ship inventory/ (lab IPs) and .wg-keys/ (private keys).
  - inventory
  - ansible.cfg
  - .wg-keys
  - "*.retry"
  - .github
  - .ansible-lint
  - .yamllint
  - tools
  - .ansible
