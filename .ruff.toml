# Ruff settings for `make check-python` and editors.
# Report syntax newer than the CI image's Python.
target-version = "py312"

[lint]
# Pyflakes (F: undefined names, unused imports) and pycodestyle's import, statement and
# file-read errors (E4, E7, E9), not Ruff's default set of several hundred rules, which
# changes between releases. Without E9, Ruff only warns about a file it can't read.
select = ["E4", "E7", "E9", "F"]
