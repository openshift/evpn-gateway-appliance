---
- name: Apply forwarding and reverse-path settings
  ansible.builtin.command: sysctl -w net.ipv4.ip_forward=1 net.ipv4.conf.all.rp_filter=0 net.ipv4.conf.default.rp_filter=0
  changed_when: false

- name: Deploy the Libreswan responder configuration
  ansible.builtin.template:
    src: ipsec.conf.j2
    dest: /etc/ipsec.conf
    mode: "0644"
    validate: ipsec addconn --checkconfig --config %s
  notify: Restart simulated AWS IPsec

- name: Deploy the test-only VPN preshared keys
  ansible.builtin.template:
    src: ipsec.secrets.j2
    dest: /etc/ipsec.secrets
    mode: "0600"
  no_log: true
  diff: false
  notify: Restart simulated AWS IPsec

- name: Enable the integrated FRR configuration
  ansible.builtin.copy:
    dest: /etc/frr/vtysh.conf
    mode: "0644"
    content: "service integrated-vtysh-config\n"
  notify: Restart simulated AWS FRR

- name: Deploy the emulated AWS BGP configuration
  ansible.builtin.template:
    src: frr.conf.j2
    dest: /etc/frr/frr.conf
    mode: "0644"
  notify: Restart simulated AWS FRR

- name: Enable and start the Libreswan responder
  ansible.builtin.systemd_service:
    name: ipsec.service
    enabled: true
    state: started

- name: Enable and start the node image's FRR service
  ansible.builtin.systemd_service:
    name: frr-container.service
    enabled: true
    state: started

- name: Apply VPN simulator configuration changes
  ansible.builtin.meta: flush_handlers
