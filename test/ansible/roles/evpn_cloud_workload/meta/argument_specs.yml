---
argument_specs:
  main:
    short_description: Configure the workload-VPC standalone EVPN VTEP.
    description:
      - >-
        Emulates OpenShift's workload EVPN with a single workload-VPC VTEP:
        host networking and FRR configuration for the stretches, and peering
        with the infra relay.
    options:
      infra_relay_host:
        type: str
        required: true
        description: Inventory hostname of the infra-VPC relay peer; its private_ip host variable is used as the BGP neighbor address.
      private_ip:
        type: str
        required: true
        description: Private IP of the host this role runs on; used as the VTEP's BGP router-id, VXLAN source and route distinguisher.
      stretches:
        type: list
        elements: dict
        required: true
        description: >-
          VLAN stretches extended between on-prem and cloud; the same list must
          be configured consistently across the fabric roles. vlan, name, subnet
          and cloud_gateway are used to build the per-stretch VXLAN interfaces
          and bridges.
        options:
          vlan:
            type: int
            required: true
            description: VLAN ID; the VNI is always 10000 + vlan. Used to build the per-stretch VXLAN interface and bridge.
          name:
            type: str
            required: true
            description: Human-readable stretch name. Used to name the per-stretch resources.
          subnet:
            type: str
            required: true
            description: IPv4 /24 subnet for this stretch. Used as the per-stretch bridge subnet.
          cloud_gateway:
            type: str
            required: true
            description: Gateway IP on the cloud workload side for this stretch. Assigned as the SVI gateway on the per-stretch bridge.
          onprem_gateway:
            type: str
            description: Gateway IP on the on-prem bridge SVI for this stretch. Part of the shared playbook configuration model; not used by this role.
      bgp:
        type: dict
        required: true
        description: ASNs and limits for the three-tier BGP EVPN fabric.
        options:
          onprem_asn:
            type: int
            required: true
            description: BGP ASN of the on-prem appliance.
          infra_asn:
            type: int
            required: true
            description: BGP ASN of the infra relay.
          workload_asn:
            type: int
            required: true
            description: BGP ASN of the workload VTEP.
          max_prefix:
            type: int
            default: 1000
            description: Defensive maximum-prefix limit applied to EVPN neighbors.
      frr_image:
        type: str
        required: true
        description: Container image reference for the FRR VTEP. Pin by tag or digest.
