---
# The health check's loss and RTT baseline against canned ping output (ping_out, printed by fake/ping); run by
# run.sh. Its tasks are taken from the role by name into $BASELINE_DIR.
- name: Add an on-premises appliance
  hosts: first
  gather_facts: false
  tasks:
    - name: Add it
      ansible.builtin.add_host:
        name: appliance
        groups: onprem_appliances
        ansible_connection: local
        private_ip: 10.200.1.10

- name: Health check baseline
  hosts: onprem_appliances
  gather_facts: false
  environment:
    PATH: "{{ playbook_dir }}/fake:{{ lookup('env', 'PATH') }}"
    PING_OUT: "{{ ping_out }}"
  vars:
    tunnel: {onprem_ip: 10.44.44.1}
    workload_vtep_host: appliance
    tasks_file: "{{ lookup('env', 'BASELINE_DIR') }}/baseline-tasks.yml"
  tasks:
    - name: Take the baseline tasks from the role
      ansible.builtin.copy:
        dest: "{{ tasks_file }}"
        content: "{{ lookup('file', playbook_dir ~ '/../../ansible/roles/evpn_health_check/tasks/main.yml') | from_yaml
                     | selectattr('name', 'search', 'workload VTEP') | list | to_nice_yaml }}"
        mode: "0644"

    - name: Run them
      ansible.builtin.include_tasks: "{{ tasks_file }}"
