---
# cloud_workload is filled by deploy.yml discovery from frr-k8s pods.
all:
  vars:
    ansible_user: root
    ansible_python_interpreter: /usr/bin/python3
  children:
    onprem_appliances:
      hosts:
        appliance-a:
          ansible_host: 172.20.20.11
          trunk_interface: trunk0
    cloud_infra:
      hosts:
        infra-router:
          ansible_host: 172.20.20.12
          private_ip: 10.100.0.1
