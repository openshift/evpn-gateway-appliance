---
# cloud_workload is populated at runtime by deploy.yml's frr-k8s discovery.
all:
  vars:
    ansible_user: root
    ansible_python_interpreter: /usr/bin/python3
  children:
    onprem_appliances:
      hosts:
        appliance-a:
          ansible_host: 172.20.20.11
          trunk_interface: simulate
    cloud_infra:
      hosts:
        infra-router:
          ansible_host: 172.20.20.12
          private_ip: 10.100.0.1
