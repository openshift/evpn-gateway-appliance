---
# kind+OVN-K lane: appliance <-> relay <-> TGW. Kind nodes replace the standalone workload.
# TGW is attached to the kind network after deploy via `podman network connect`.
name: ega-evpn-kind

mgmt:
  network: clab
  ipv4-subnet: 172.20.20.0/24

topology:
  defaults:
    kind: linux
    image: ${EGA_NODE_IMAGE}
    cgroupns-mode: host
    tmpfs:
      /run: rw,nosuid,nodev
      /run/lock: rw,nosuid,nodev,noexec
      /tmp: rw,nosuid,nodev
    binds:
      - ${EGA_SSH_PUBKEY}:/root/.ssh/authorized_keys:ro
  nodes:
    appliance:
      mgmt-ipv4: 172.20.20.11
    relay:
      mgmt-ipv4: 172.20.20.12
      exec:
        - ip addr add 10.100.0.1/24 dev eth1
        - ip link set eth1 up
        - ip route replace 10.200.0.0/16 via 10.100.0.2
        - ip route replace 172.18.0.0/16 via 10.100.0.2
    tgw:
      mgmt-ipv4: 172.20.20.13
      # Kind-network route added by entrypoint.sh after `podman network connect`.
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - sysctl -w net.ipv4.conf.all.forwarding=1
        - ip addr add 10.100.0.2/24 dev eth1
        - ip link set eth1 up
        - ip route replace 10.44.44.0/24 via 10.100.0.1
  links:
    - endpoints: ["tgw:eth1", "relay:eth1"]
