---
# CORENET-7502 emulated all-active multihoming lane.
# The edge host terminates one two-link LACP bundle spanning both appliance
# VTEPs. Each appliance contributes one link to that ESI-LAG through its
# single-member bond. A separate relay carries the EVPN control plane, which
# is required to exercise Type-1/Type-4 Ethernet-Segment state.
name: ega-evpn

mgmt:
  network: clab
  ipv4-subnet: 172.20.20.0/24

topology:
  defaults:
    kind: linux
    image: ${EGA_NODE_IMAGE}
    cgroupns-mode: host
    tmpfs:
      /run: rw,nosuid,nodev
      /run/lock: rw,nosuid,nodev,noexec
      /tmp: rw,nosuid,nodev
    binds:
      - ${EGA_SSH_PUBKEY}:/root/.ssh/authorized_keys:ro
  nodes:
    appliance-a:
      mgmt-ipv4: 172.20.20.21
      exec:
        - bash -c 'nmcli dev set eth2 managed no || true; ip addr add 10.44.44.1/30 dev eth2; ip link set eth2 up'
    appliance-b:
      mgmt-ipv4: 172.20.20.22
      exec:
        - bash -c 'nmcli dev set eth2 managed no || true; ip addr add 10.44.44.5/30 dev eth2; ip link set eth2 up'
    relay:
      mgmt-ipv4: 172.20.20.23
      exec:
        - bash -c 'for i in eth1 eth2; do nmcli dev set $i managed no || true; done; ip addr add 10.44.44.2/30 dev eth1; ip addr add 10.44.44.6/30 dev eth2; ip link set eth1 up; ip link set eth2 up'
    edge-host:
      mgmt-ipv4: 172.20.20.24
      exec:
        - bash -c 'modprobe bonding || true; for i in eth1 eth2; do nmcli dev set $i managed no || true; done; systemctl stop NetworkManager || true'
        # A Linux bond cannot faithfully model one MLAG actor spanning two
        # independent namespaces: both peers expose the same LACP port number.
        # Use one LACP bond per edge-facing link and join them through a
        # VLAN-aware bridge, which emulates the switch edge bridge while still
        # exercising LACP on each appliance-facing link.
        - ip link add edge-bond-a type bond mode 802.3ad
        - ip link add edge-bond-b type bond mode 802.3ad
        - ip link set edge-bond-a type bond lacp_rate fast xmit_hash_policy layer3+4
        - ip link set edge-bond-b type bond lacp_rate fast xmit_hash_policy layer3+4
        - ip link add edge-br type bridge vlan_filtering 1
        - ip link set edge-br up
        - ip link set eth1 down
        - ip link set eth2 down
        - ip link set eth1 master edge-bond-a
        - ip link set eth2 master edge-bond-b
        - ip link set eth1 up
        - ip link set eth2 up
        - ip link set edge-bond-a up
        - ip link set edge-bond-b up
        - ip link set edge-bond-a master edge-br
        - ip link set edge-bond-b master edge-br
        - bash -c 'for p in edge-bond-a edge-bond-b; do for v in 100 200 300; do bridge vlan add vid $v dev $p; done; done; for v in 100 200 300; do bridge vlan add vid $v dev edge-br self; done'
        - ip link add link edge-br name edge-br.100 type vlan id 100
        - ip addr add 10.42.1.10/24 dev edge-br.100
        - ip link set edge-br.100 up
        - ip route replace 10.42.2.0/24 via 10.42.1.1 dev edge-br.100
        - ip route replace 10.42.3.0/24 via 10.42.1.1 dev edge-br.100
  links:
    - endpoints: ["appliance-a:eth1", "edge-host:eth1"]
    - endpoints: ["appliance-b:eth1", "edge-host:eth2"]
    - endpoints: ["appliance-a:eth2", "relay:eth1"]
    - endpoints: ["appliance-b:eth2", "relay:eth2"]
