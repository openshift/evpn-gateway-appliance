---
# Emulated EVPN fabric: appliance <-> relay <-> TGW <-> workload, deployed by the
# collection's playbooks/deploy.yml. ansible reaches each node over SSH on its clab mgmt IP.
#
# Subnets:
#   mgmt    172.20.20.0/24  SSH, and the WireGuard underlay for onprem<->relay (WG endpoint
#                           is the relay's mgmt IP, i.e. its ansible_host).
#   infra   10.100.0.0/24   relay<->tgw link (relay 10.100.0.1, tgw 10.100.0.2) = infra VPC.
#   wkld    10.200.0.0/24   tgw<->workload link (tgw 10.200.0.2, workload 10.200.0.1) = wkld VPC.
#   overlay 10.44.44.0/24   WireGuard tunnel (onprem 10.44.44.1, relay 10.44.44.2) + VTEPs.
#
# VTEPs: onprem 10.44.44.1 (wg0), workload 10.200.0.1 (its VPC IP). The relay forwards
# onprem<->workload VXLAN between the tunnel and the infra link; the TGW routes between the
# infra and workload VPCs (static routes for now; next-hop target, not a default gateway).
# This mirrors AWS and keeps the relay<->TGW seam stable if the workload is later replaced
# by a kind cluster (the TGW would attach to kind's bridge instead of this p2p link).
#
# Nodes run the appliance's systemd container image (privileged linux-kind default + host
# cgroup namespace + tmpfs = the --systemd=always equivalent). An ephemeral public key
# generated per run (EGA_SSH_PUBKEY) is bound into each node's root authorized_keys.
name: ega-evpn

mgmt:
  network: clab
  ipv4-subnet: 172.20.20.0/24

topology:
  defaults:
    kind: linux
    image: ${EGA_NODE_IMAGE}
    cgroupns-mode: host
    tmpfs:
      /run: rw,nosuid,nodev
      /run/lock: rw,nosuid,nodev,noexec
      /tmp: rw,nosuid,nodev
    binds:
      - ${EGA_SSH_PUBKEY}:/root/.ssh/authorized_keys:ro
  nodes:
    appliance:
      mgmt-ipv4: 172.20.20.11
    relay:
      mgmt-ipv4: 172.20.20.12
      # infra-VPC side toward the TGW; reach the workload VPC through it.
      exec:
        - ip addr add 10.100.0.1/24 dev eth1
        - ip link set eth1 up
        - ip route replace 10.200.0.0/16 via 10.100.0.2
    tgw:
      mgmt-ipv4: 172.20.20.13
      # Transit Gateway: routes between the infra and workload VPCs, and to the onprem VTEP
      # via the relay. Not deployed by the collection; a plain forwarding router.
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - sysctl -w net.ipv4.conf.all.forwarding=1
        - ip addr add 10.100.0.2/24 dev eth1
        - ip link set eth1 up
        - ip addr add 10.200.0.2/24 dev eth2
        - ip link set eth2 up
        - ip route replace 10.44.44.0/24 via 10.100.0.1
    workload:
      mgmt-ipv4: 172.20.20.14
      # workload-VPC side toward the TGW; reach the onprem VTEP + infra VPC through it.
      exec:
        - ip addr add 10.200.0.1/24 dev eth1
        - ip link set eth1 up
        - ip route replace 10.44.44.0/24 via 10.200.0.2
        - ip route replace 10.100.0.0/16 via 10.200.0.2
  links:
    - endpoints: ["tgw:eth1", "relay:eth1"]
    - endpoints: ["tgw:eth2", "workload:eth1"]
