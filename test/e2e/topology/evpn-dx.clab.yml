---
# Direct Connect variant: a plain routed 8500-byte link from the appliance to the TGW stands in for
# the customer router, transit VIF and DX gateway, which the collection does not configure.
# VXLAN crosses it unencrypted, as on DX. See test/e2e/README.md, "Transport scenarios".
name: ega-evpn

mgmt:
  network: clab
  ipv4-subnet: 172.20.20.0/24

topology:
  defaults:
    kind: linux
    image: ${EGA_NODE_IMAGE}
    cgroupns-mode: host
    tmpfs:
      /run: rw,nosuid,nodev
      /run/lock: rw,nosuid,nodev,noexec
      /tmp: rw,nosuid,nodev
    binds:
      - ${EGA_SSH_PUBKEY}:/root/.ssh/authorized_keys:ro
  nodes:
    appliance:
      mgmt-ipv4: 172.20.20.11
      # Customer side of the DX path: the link to the TGW; FRR routes both VPCs over it (tunnel.next_hop).
      exec:
        - bash -c 'for i in $(seq 1 10); do systemctl is-active --quiet NetworkManager && break; sleep 1; done'
        # NetworkManager owns the uplink, as on a production appliance.
        - nmcli con add type ethernet ifname eth1 con-name uplink ipv4.method manual ipv4.addresses 10.99.0.2/30 ipv6.method disabled
        - nmcli con mod uplink 802-3-ethernet.mtu 8500
        - nmcli con up uplink
    relay:
      mgmt-ipv4: 172.20.20.12
      # infra-VPC side toward the TGW; reach the workload VPC through it.
      exec:
         # Make sure NM has started and unmanage devices
        - bash -c 'for i in $(seq 1 10); do systemctl is-active --quiet NetworkManager && break; sleep 1; done'
        - nmcli dev set eth1 managed no
        - ip addr add 10.100.0.1/24 dev eth1
        - ip link set eth1 up
        - ip route replace 10.200.0.0/16 via 10.100.0.2
        - ip route replace 10.44.44.0/24 via 10.100.0.2
    tgw:
      mgmt-ipv4: 172.20.20.13
      # Transit Gateway: routes between the VPCs and, over the DX link, to the on-prem VTEP network
      # (the route a customer router would advertise over the VIF).
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - sysctl -w net.ipv4.conf.all.forwarding=1
        # Make sure NM has started and unmanage devices
        - bash -c 'for i in $(seq 1 10); do systemctl is-active --quiet NetworkManager && break; sleep 1; done'
        - nmcli dev set eth1 managed no
        - nmcli dev set eth2 managed no
        - nmcli dev set eth3 managed no
        - ip addr add 10.100.0.2/24 dev eth1
        - ip link set eth1 up
        - ip addr add 10.200.0.2/24 dev eth2
        - ip link set eth2 up
        - ip addr add 10.99.0.1/30 dev eth3
        - ip link set eth3 up
        - ip route replace 10.44.44.0/24 via 10.99.0.2
    workload:
      mgmt-ipv4: 172.20.20.14
      # workload-VPC side toward the TGW; reach the onprem VTEP + infra VPC through it.
      exec:
        # Make sure NM has started and unmanage devices
        - bash -c 'for i in $(seq 1 10); do systemctl is-active --quiet NetworkManager && break; sleep 1; done'
        - nmcli dev set eth1 managed no
        - ip addr add 10.200.0.1/24 dev eth1
        - ip link set eth1 up
        - ip route replace 10.44.44.0/24 via 10.200.0.2
        - ip route replace 10.100.0.0/16 via 10.200.0.2
  links:
    - endpoints: ["tgw:eth1", "relay:eth1"]
    - endpoints: ["tgw:eth2", "workload:eth1"]
    # A transit VIF's jumbo MTU.
    - endpoints: ["tgw:eth3", "appliance:eth1"]
      mtu: 8500
