---
# CORENET-7503 local validation topology.
#
# Two relays share an on-prem L3 segment and have independent routed links to the
# simulated TGW.  The transport is direct-connect for this lab: it exercises the
# relay BGP fan-out and ECMP behavior without claiming that the current single-
# endpoint WireGuard transport is HA.
name: ega-7503

mgmt:
  network: clab
  ipv4-subnet: 172.20.20.0/24

topology:
  defaults:
    kind: linux
    image: ${EGA_NODE_IMAGE}
    cgroupns-mode: host
    tmpfs:
      /run: rw,nosuid,nodev
      /run/lock: rw,nosuid,nodev,noexec
      /tmp: rw,nosuid,nodev
    binds:
      - ${EGA_SSH_PUBKEY}:/root/.ssh/authorized_keys:ro
  nodes:
    appliance:
      mgmt-ipv4: 172.20.20.11
      exec:
        - ip addr add 10.44.44.1/24 dev eth1
        - ip link set eth1 up
        - ip route replace 10.200.0.0/24 via 10.44.44.2
        - ip route add 10.200.0.0/24 via 10.44.44.3 metric 20
    underlay-switch:
      mgmt-ipv4: 172.20.20.16
    relay-a:
      mgmt-ipv4: 172.20.20.12
      exec:
        - bash -c 'for i in $(seq 1 10); do systemctl is-active --quiet NetworkManager && break; sleep 1; done'
        - nmcli dev set eth1 managed no
        - nmcli dev set eth2 managed no
        - ip addr add 10.44.44.2/24 dev eth1
        - ip addr add 10.100.1.1/30 dev eth2
        - ip link set eth1 up
        - ip link set eth2 up
        - ip route replace 10.200.0.0/24 via 10.100.1.2
    relay-b:
      mgmt-ipv4: 172.20.20.15
      exec:
        - bash -c 'for i in $(seq 1 10); do systemctl is-active --quiet NetworkManager && break; sleep 1; done'
        - nmcli dev set eth1 managed no
        - nmcli dev set eth2 managed no
        - ip addr add 10.44.44.3/24 dev eth1
        - ip addr add 10.100.2.1/30 dev eth2
        - ip link set eth1 up
        - ip link set eth2 up
        - ip route replace 10.200.0.0/24 via 10.100.2.2
    tgw:
      mgmt-ipv4: 172.20.20.13
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - sysctl -w net.ipv4.conf.all.forwarding=1
        - bash -c 'for i in $(seq 1 10); do systemctl is-active --quiet NetworkManager && break; sleep 1; done'
        - nmcli dev set eth1 managed no
        - nmcli dev set eth2 managed no
        - nmcli dev set eth3 managed no
        - ip addr add 10.100.1.2/30 dev eth1
        - ip addr add 10.200.0.2/24 dev eth2
        - ip addr add 10.100.2.2/30 dev eth3
        - ip link set eth1 up
        - ip link set eth2 up
        - ip link set eth3 up
        - ip route replace 10.44.44.0/24 via 10.100.1.1
        - ip route add 10.44.44.0/24 via 10.100.2.1 metric 20
    workload:
      mgmt-ipv4: 172.20.20.14
      exec:
        - bash -c 'for i in $(seq 1 10); do systemctl is-active --quiet NetworkManager && break; sleep 1; done'
        - nmcli dev set eth1 managed no
        - ip addr add 10.200.0.1/24 dev eth1
        - ip link set eth1 up
        - ip route replace 10.44.44.0/24 via 10.200.0.2
        - ip route replace 10.100.1.0/30 via 10.200.0.2
        - ip route replace 10.100.2.0/30 via 10.200.0.2
  links:
    - endpoints: ["appliance:eth1", "underlay-switch:eth1"]
    - endpoints: ["relay-a:eth1", "underlay-switch:eth2"]
    - endpoints: ["relay-b:eth1", "underlay-switch:eth3"]
    - endpoints: ["relay-a:eth2", "tgw:eth1"]
    - endpoints: ["relay-b:eth2", "tgw:eth3"]
    - endpoints: ["tgw:eth2", "workload:eth1"]
