---
# Appliance, relay, and TGW. Workload peers are the kind nodes, filled in by discovery.
# ega-kind-br is the host bridge for the kind network. tgw eth1 is enslaved to it.
# The relay link is eth2. The bridge node's post-deploy firewall rules install via
# the nftables backend (host preloaded with xt_comment and docker's chain layout
# by run.sh / setup-cluster.sh).
name: ega-kind

mgmt:
  network: clab
  ipv4-subnet: 172.20.20.0/24

topology:
  defaults:
    kind: linux
    image: ${EGA_NODE_IMAGE}
    cgroupns-mode: host
    tmpfs:
      /run: rw,nosuid,nodev
      /run/lock: rw,nosuid,nodev,noexec
      /tmp: rw,nosuid,nodev
    binds:
      - ${EGA_SSH_PUBKEY}:/root/.ssh/authorized_keys:ro
  nodes:
    ega-kind-br:
      kind: bridge
    appliance:
      mgmt-ipv4: 172.20.20.11
    relay:
      mgmt-ipv4: 172.20.20.12
      exec:
        - ip addr add 10.100.0.1/24 dev eth1
        - ip link set eth1 up
        - ip route replace 10.89.0.0/24 via 10.100.0.2
    tgw:
      mgmt-ipv4: 172.20.20.13
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - sysctl -w net.ipv4.conf.all.forwarding=1
        - ip addr add 10.89.0.2/24 dev eth1
        - ip link set eth1 up
        - ip addr add 10.100.0.2/24 dev eth2
        - ip link set eth2 up
        - ip route replace 10.44.44.0/24 via 10.100.0.1
  links:
    - endpoints: ["tgw:eth1", "ega-kind-br:tgw-eth1"]
    - endpoints: ["tgw:eth2", "relay:eth1"]
