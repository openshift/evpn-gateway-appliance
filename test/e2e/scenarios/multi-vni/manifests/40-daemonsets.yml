# One workload pod per CUDN per kind node (the DaemonSet tolerates the
# control-plane taint). agnhost netexec answers HTTP on 8080 so checks.sh can
# probe both ping and HTTP from the simulated on-prem hosts. The pods' primary
# addresses come from the CUDN subnets via the namespace
# k8s.ovn.org/primary-user-defined-network label.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ega-test-workload
  namespace: production
spec:
  selector:
    matchLabels:
      app: ega-test-workload
  template:
    metadata:
      labels:
        app: ega-test-workload
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
      containers:
        - name: agnhost
          image: registry.k8s.io/e2e-test-images/agnhost:2.43
          args:
            - netexec
            - --http-port=8080
---
