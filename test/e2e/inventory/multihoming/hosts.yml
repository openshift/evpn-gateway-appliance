---
# CORENET-7502 CI inventory. Underlay routing is provisioned by the topology.
all:
  vars:
    ansible_user: root
    ansible_python_interpreter: /usr/bin/python3
  children:
    onprem_appliances:
      hosts:
        appliance-a:
          ansible_host: 172.20.20.21
          tunnel:
            type: direct-connect
            # Per-appliance VTEP/router-id; host vars override the shared defaults.
            onprem_ip: 10.44.44.1
            cloud_ip: 10.44.44.2
            network_cidr: 10.44.44.0/24
            underlay_interface: eth2
          bgp:
            onprem_asn: 65044
            infra_asn: 65100
            workload_asn: 65200
          multihoming:
            enabled: true
            bond_interfaces: [eth1]
            es_id: 1
            es_sys_mac: "02:aa:bb:cc:dd:ee"
            anycast_mac: "02:00:5e:00:00:01"
            df_pref: 40000
        appliance-b:
          ansible_host: 172.20.20.22
          tunnel:
            type: direct-connect
            onprem_ip: 10.44.44.5
            cloud_ip: 10.44.44.6
            network_cidr: 10.44.44.0/24
            underlay_interface: eth2
          bgp:
            onprem_asn: 65045
            infra_asn: 65100
            workload_asn: 65200
    cloud_infra:
      hosts:
        relay:
          ansible_host: 172.20.20.23
          private_ip: 10.200.0.2
          tunnel:
            type: direct-connect
    cloud_workload:
      hosts:
        workload:
          ansible_host: 172.20.20.25
          private_ip: 10.200.0.1
    edge_hosts:
      hosts:
        edge-host:
          ansible_host: 172.20.20.24
