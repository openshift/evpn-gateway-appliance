---
# CORENET-7502 CI inventory. The same playbook can target a qualification
# inventory later; only these environment-specific addresses/topology change.
all:
  vars:
    ansible_user: root
    ansible_python_interpreter: /usr/bin/python3
  children:
    onprem_appliances:
      hosts:
        appliance-a:
          ansible_host: 172.20.20.21
          evpn_underlay_ip: 10.44.44.1
          evpn_relay_ip: 10.44.44.2
        appliance-b:
          ansible_host: 172.20.20.22
          evpn_underlay_ip: 10.44.44.5
          evpn_relay_ip: 10.44.44.6
    evpn_relays:
      hosts:
        relay:
          ansible_host: 172.20.20.23
    edge_hosts:
      hosts:
        edge-host:
          ansible_host: 172.20.20.24
