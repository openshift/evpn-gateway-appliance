---
# e2e inventory for the emulated fabric. Host and group names match what the collection's
# playbooks/deploy.yml and group_vars/all.yml expect (infra_relay_host: infra-router, etc.).
# ansible_host is each node's static clab mgmt IP (see topology/evpn.clab.yml); the relay's
# doubles as the WireGuard endpoint. private_ip is the node's VPC IP: relay 10.100.0.1
# (infra VPC), workload VTEP 10.200.0.1 (workload VPC), reached across the TGW. Connection
# is SSH as root with the per-run ephemeral key (passed on the ansible-playbook command line).
all:
  vars:
    ansible_user: root
    ansible_python_interpreter: /usr/bin/python3
  children:
    onprem_appliances:
      hosts:
        appliance-a:
          ansible_host: 172.20.20.11
          trunk_interface: simulate
    cloud_infra:
      hosts:
        infra-router:
          ansible_host: 172.20.20.12
          private_ip: 10.100.0.1
    cloud_workload:
      hosts:
        workload-router:
          ansible_host: 172.20.20.14
          private_ip: 10.200.0.1
