---
all:
  vars:
    ansible_user: root
    ansible_python_interpreter: /usr/bin/python3
  children:
    onprem_appliances:
      hosts:
        appliance-a:
          ansible_host: 172.20.20.11
          trunk_interface: trunk0
          relay_ha_ports: [eth1]
          relay_ha_addresses:
            - {dev: eth1, cidr: 10.44.44.1/24}
          relay_ha_routes:
            - {prefix: 10.200.0.0/24, via: 10.44.44.2}
            - {prefix: 10.200.0.0/24, via: 10.44.44.3, metric: 20}
    cloud_infra:
      vars:
        relay_ha_ports: [eth1, eth2]
      hosts:
        relay-a:
          ansible_host: 172.20.20.12
          private_ip: 10.100.1.1
          relay_ha_addresses:
            - {dev: eth1, cidr: 10.44.44.2/24}
            - {dev: eth2, cidr: 10.100.1.1/30}
          relay_ha_routes:
            - {prefix: 10.200.0.0/24, via: 10.100.1.2}
        relay-b:
          ansible_host: 172.20.20.15
          private_ip: 10.100.2.1
          relay_ha_addresses:
            - {dev: eth1, cidr: 10.44.44.3/24}
            - {dev: eth2, cidr: 10.100.2.1/30}
          relay_ha_routes:
            - {prefix: 10.200.0.0/24, via: 10.100.2.2}
    cloud_workload:
      hosts:
        workload-router:
          ansible_host: 172.20.20.14
          private_ip: 10.200.0.1
          relay_ha_ports: [eth1]
          relay_ha_addresses:
            - {dev: eth1, cidr: 10.200.0.1/24}
          relay_ha_routes:
            - {prefix: 10.44.44.0/24, via: 10.200.0.2}
            - {prefix: 10.100.1.0/30, via: 10.200.0.2}
            - {prefix: 10.100.2.0/30, via: 10.200.0.2}
    relay_ha_transit:
      hosts:
        tgw:
          ansible_host: 172.20.20.13
          relay_ha_ports: [eth1, eth2, eth3]
          relay_ha_addresses:
            - {dev: eth1, cidr: 10.100.1.2/30}
            - {dev: eth2, cidr: 10.200.0.2/24}
            - {dev: eth3, cidr: 10.100.2.2/30}
          relay_ha_routes:
            - {prefix: 10.44.44.0/24, via: 10.100.1.1}
            - {prefix: 10.44.44.0/24, via: 10.100.2.1, metric: 20}
    relay_ha_switch:
      hosts:
        underlay-switch:
          ansible_host: 172.20.20.16
          relay_ha_ports: [eth1, eth2, eth3]
