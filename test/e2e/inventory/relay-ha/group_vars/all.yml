---
tunnel:
  type: direct-connect
  mtu_mode: unsafe
  onprem_ip: 10.44.44.1
  cloud_ip: 10.44.44.2
  network_cidr: 10.44.44.0/24
  port: 51820

infra_relay_host: relay-a
workload_vtep_host: workload-router

infra_vpc_cidr: 10.100.0.0/16
workload_vpc_cidr: 10.200.0.0/16
ocp_pod_network_cidr: 10.128.0.0/16

bgp:
  onprem_asn: 65044
  infra_asn: 65100
  workload_asn: 65200
  infra_peers:
    - 10.44.44.2
    - 10.44.44.3

stretches:
  - vlan: 100
    name: production
    subnet: 10.42.1.0/24
    onprem_gateway: 10.42.1.1
    cloud_gateway: 10.42.1.2
  - vlan: 200
    name: staging
    subnet: 10.42.2.0/24
    onprem_gateway: 10.42.2.1
    cloud_gateway: 10.42.2.2
  - vlan: 300
    name: management
    subnet: 10.42.3.0/24
    onprem_gateway: 10.42.3.1
    cloud_gateway: 10.42.3.2

monitoring:
  node_exporter: true
  frr_exporter: false

frr_image: quay.io/frrouting/frr:10.5.3
